<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <!-- Site-A -->
  <rect x="40" y="80" width="300" height="340" rx="10" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="8,4" />
  <text x="50" y="70" font-family="Helvetica" font-size="16" font-weight="bold" fill="#374151">Site-A (Primary)</text>
  <rect x="90" y="180" width="200" height="100" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
  <text x="190" y="230" font-family="Helvetica" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">PostgreSQL</text>
  <text x="190" y="255" font-family="Helvetica" font-size="12" text-anchor="middle" fill="#64748b">WAL Archiving enabled</text>
  <!-- Central-DR -->
  <rect x="440" y="80" width="480" height="340" rx="10" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="8,4" />
  <text x="450" y="70" font-family="Helvetica" font-size="16" font-weight="bold" fill="#374151">Central-DR (DR Site)</text>
  <!-- pgBackRest -->
  <rect x="500" y="140" width="180" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
  <text x="590" y="185" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#065f46">pgBackRest Repo</text>
  <!-- S3 Storage -->
  <path d="M 760,260 A 60,30 0 0 0 880,260 L 880,340 A 60,30 0 0 1 760,340 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)" />
  <ellipse cx="820" cy="260" rx="60" ry="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
  <text x="820" y="310" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">S3 Storage</text>
  <!-- Arrows -->
  <path d="M 290,230 L 500,180" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none" />
  <text x="350" y="200" font-family="Helvetica" font-size="12" fill="#059669" font-weight="bold">1. WAL Stream</text>
  <path d="M 590,220 L 590,300 L 760,300" stroke="#1e293b" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <text x="610" y="290" font-family="Helvetica" font-size="12" fill="#1e293b">2. Block Backup</text>
</svg>