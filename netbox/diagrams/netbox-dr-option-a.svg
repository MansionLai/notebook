<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <!-- Site-A Container -->
  <rect x="40" y="80" width="360" height="340" rx="10" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="8,4" />
  <text x="50" y="70" font-family="Helvetica" font-size="16" font-weight="bold" fill="#374151">Site-A (Primary)</text>
  <!-- PostgreSQL -->
  <rect x="120" y="140" width="200" height="80" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
  <text x="220" y="180" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">PostgreSQL</text>
  <text x="220" y="200" font-family="Helvetica" font-size="12" text-anchor="middle" fill="#64748b">Bitnami PG 16</text>
  <!-- CronJob -->
  <rect x="120" y="300" width="200" height="80" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)" />
  <text x="220" y="340" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#0369a1">K8s CronJob</text>
  <text x="220" y="360" font-family="Helvetica" font-size="12" text-anchor="middle" fill="#0369a1">netbox-backup</text>
  <!-- Central-DR Container -->
  <rect x="560" y="80" width="360" height="340" rx="10" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="8,4" />
  <text x="570" y="70" font-family="Helvetica" font-size="16" font-weight="bold" fill="#374151">Central-DR (DR Site)</text>
  <!-- Nexus -->
  <rect x="640" y="210" width="200" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)" />
  <text x="740" y="260" font-family="Helvetica" font-size="16" font-weight="bold" text-anchor="middle" fill="#9a3412">Nexus Repo</text>
  <text x="740" y="285" font-family="Helvetica" font-size="12" text-anchor="middle" fill="#9a3412">raw (hosted)</text>
  <!-- Arrows -->
  <path d="M 220,220 L 220,300" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <text x="230" y="265" font-family="Helvetica" font-size="12" fill="#64748b">1. pg_dump</text>
  <path d="M 320,340 L 640,260" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
  <rect x="420" y="280" width="120" height="24" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="480" y="297" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle" fill="#2563eb">2. HTTP PUT</text>
  <!-- Legend -->
  <rect x="40" y="440" width="200" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
  <line x1="50" y1="460" x2="80" y2="460" stroke="#2563eb" stroke-width="2.5" />
  <text x="90" y="465" font-family="Helvetica" font-size="12" fill="#475569">Data Transfer (Offsite)</text>
</svg>