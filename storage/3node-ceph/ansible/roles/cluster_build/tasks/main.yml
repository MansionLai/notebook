# =================================================================
# SECTION 1: Bootstrap (Only on first MON node)
# =================================================================

- name: Check whether the cluster is already bootstrapped
  ansible.builtin.stat:
    path: /etc/ceph/ceph.conf
  register: ceph_cluster_bootstrapped
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Bootstrap Ceph cluster on first MON node
  ansible.builtin.command: >
    cephadm --image {{ ceph_container_image }} bootstrap
    --mon-ip {{ ceph_public_ip }}
    --cluster-network {{ ceph_cluster_network_cidr }}
    --initial-dashboard-user {{ ceph_dashboard_user }}
    --initial-dashboard-password {{ ceph_dashboard_password }}
    --allow-fqdn-hostname
    --ssh-user {{ ansible_user }}
    --ssh-private-key /home/{{ ansible_user }}/.ssh/id_rsa
    --ssh-public-key /home/{{ ansible_user }}/.ssh/id_rsa.pub
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"
  when: not ceph_cluster_bootstrapped.stat.exists

# =================================================================
# SECTION 2: Distribute Configuration to All MON nodes
# =================================================================

- name: Distribute ceph.conf to all MON nodes for CLI access
  ansible.builtin.fetch:
    src: /etc/ceph/ceph.conf
    dest: /tmp/ceph.conf
    flat: yes
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Copy ceph.conf to all MON nodes
  ansible.builtin.copy:
    src: /tmp/ceph.conf
    dest: /etc/ceph/ceph.conf
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['ceph_mon']

- name: Distribute admin keyring to all MON nodes for CLI access
  ansible.builtin.fetch:
    src: /etc/ceph/ceph.client.admin.keyring
    dest: /tmp/ceph.client.admin.keyring
    flat: yes
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Copy admin keyring to all MON nodes
  ansible.builtin.copy:
    src: /tmp/ceph.client.admin.keyring
    dest: /etc/ceph/ceph.client.admin.keyring
    owner: root
    group: root
    mode: "0600"
  when: inventory_hostname in groups['ceph_mon']

# =================================================================
# SECTION 3: Cluster Orchestration (Only on first MON node)
# =================================================================

- name: Read existing orchestrator hosts
  ansible.builtin.command: ceph orch host ls --format json
  register: ceph_orch_host_ls
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Parse orchestrator host list
  ansible.builtin.set_fact:
    ceph_existing_hosts: "{{ (ceph_orch_host_ls.stdout | from_json) | map(attribute='hostname') | list }}"
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Build desired OSD target list from inventory
  ansible.builtin.set_fact:
    ceph_desired_osd_targets: >-
      {%- set ns = namespace(targets=[]) -%}
      {%- for host in groups['ceph_osd'] -%}
      {%-   for device in hostvars[host].ceph_osd_devices -%}
      {%-     set _ = ns.targets.append({'hostname': host, 'path': device}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ ns.targets }}
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Build location mappings from inventory (OSD hosts)
  ansible.builtin.set_fact:
    ceph_location_mappings: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for host in groups['ceph_osd'] -%}
      {%-   set _ = ns.items.append({
              'hostname': host,
              'datacenter': hostvars[host].datacenter | default(datacenter),
              'room': hostvars[host].room | default(room),
              'rack': hostvars[host].rack
            }) -%}
      {%- endfor -%}
      {{ ns.items }}
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Ensure Ceph public network is configured
  ansible.builtin.command: ceph config set mon public_network {{ ceph_public_network_cidr }}
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Ensure Ceph cluster network is configured
  ansible.builtin.command: ceph config set global cluster_network {{ ceph_cluster_network_cidr }}
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Add missing MON hosts to the orchestrator
  ansible.builtin.command: ceph orch host add {{ item }} {{ hostvars[item].ceph_public_ip }}
  loop: "{{ groups['ceph_mon'] }}"
  when: item not in ceph_existing_hosts
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Add missing OSD hosts to the orchestrator with location
  ansible.builtin.command: >
    ceph orch host add
    {{ item.hostname }}
    {{ hostvars[item.hostname].ceph_public_ip }}
    --location "datacenter={{ item.datacenter }} room={{ item.room }} rack={{ item.rack }}"
  loop: "{{ ceph_location_mappings }}"
  when: item.hostname not in ceph_existing_hosts
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Apply MON placement - distribute across all MON nodes
  ansible.builtin.command: >
    ceph orch apply mon
    --placement="{{ groups['ceph_mon'] | length }} {{ groups['ceph_mon'] | join(' ') }}"
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Apply MGR placement - distribute across all MON nodes
  ansible.builtin.command: >
    ceph orch apply mgr
    --placement="{{ groups['ceph_mon'] | length }} {{ groups['ceph_mon'] | join(' ') }}"
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Add OSD devices from inventory mapping
  ansible.builtin.command: ceph orch daemon add osd {{ item.hostname }}:{{ item.path }}
  loop: "{{ ceph_desired_osd_targets }}"
  register: ceph_osd_add_result
  failed_when:
    - ceph_osd_add_result.rc != 0
    - "'already' not in ceph_osd_add_result.stderr"
    - "'exclusively.  Mounted filesystem?' not in ceph_osd_add_result.stderr"
  changed_when: ceph_osd_add_result.rc == 0
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Check Ceph status until cluster is ready
  ansible.builtin.command: ceph -s --format json
  register: ceph_status_json
  changed_when: false
  retries: 30
  delay: 20
  until:
    - (ceph_status_json.stdout | from_json).monmap.num_mons | int == groups['ceph_mon'] | length
    - (ceph_status_json.stdout | from_json).osdmap.num_up_osds | int == (ceph_desired_osd_targets | length)
    - (ceph_status_json.stdout | from_json).osdmap.num_in_osds | int == (ceph_desired_osd_targets | length)
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

# =================================================================
# SECTION 4: CRUSH rule setup and placement verification metadata
# =================================================================

- name: Extract unique datacenters from locations
  ansible.builtin.set_fact:
    ceph_unique_datacenters: "{{ ceph_location_mappings | map(attribute='datacenter') | unique | list }}"
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Extract unique room-to-datacenter mappings
  ansible.builtin.set_fact:
    ceph_room_mappings: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for item in ceph_location_mappings -%}
      {%-   if {'room': item.room, 'datacenter': item.datacenter} not in ns.items -%}
      {%-     set _ = ns.items.append({'room': item.room, 'datacenter': item.datacenter}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Extract unique rack-to-room mappings
  ansible.builtin.set_fact:
    ceph_rack_mappings: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for item in ceph_location_mappings -%}
      {%-   if {'rack': item.rack, 'room': item.room} not in ns.items -%}
      {%-     set _ = ns.items.append({'rack': item.rack, 'room': item.room}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"


- name: Ensure replicated CRUSH rule uses rack failure domain
  ansible.builtin.command: >
    ceph osd crush rule create-replicated
    {{ ceph_rbd_crush_rule_name }}
    {{ ceph_unique_datacenters[0] }}
    rack
  register: ceph_crush_rule_create
  failed_when:
    - ceph_crush_rule_create.rc != 0
    - "'already exists' not in ceph_crush_rule_create.stderr"
  changed_when: "'already exists' not in ceph_crush_rule_create.stderr"
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

# =================================================================
# SECTION 5: Verification (Only on first MON node)
# =================================================================

- name: Verify MON quorum
  ansible.builtin.command: ceph mon stat
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Verify OSD tree
  ansible.builtin.command: ceph osd tree
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Read CRUSH rule detail
  ansible.builtin.command: ceph osd crush rule dump {{ ceph_rbd_crush_rule_name }} --format json
  register: ceph_crush_rule_json
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Assert CRUSH rule uses rack failure domain
  ansible.builtin.assert:
    that:
      - ceph_crush_rule_json.stdout is search('"type"\\s*:\\s*"rack"')
    fail_msg: "CRUSH rule {{ ceph_rbd_crush_rule_name }} does not use rack as failure domain."
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Read CRUSH tree in JSON
  ansible.builtin.command: ceph osd crush tree --format json
  register: ceph_crush_tree_json
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Assert CRUSH hierarchy levels exist
  ansible.builtin.assert:
    that:
      - ceph_crush_tree_json.stdout is search('"type"\\s*:\\s*"datacenter"')
      - ceph_crush_tree_json.stdout is search('"type"\\s*:\\s*"room"')
      - ceph_crush_tree_json.stdout is search('"type"\\s*:\\s*"rack"')
      - ceph_crush_tree_json.stdout is search('"type"\\s*:\\s*"host"')
    fail_msg: "CRUSH tree does not include expected datacenter/room/rack/host levels."
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Assert configured datacenter buckets exist
  ansible.builtin.assert:
    that:
      - ceph_crush_tree_json.stdout is search('"name"\\s*:\\s*"' ~ item ~ '"')
    fail_msg: "Missing datacenter bucket {{ item }} in CRUSH tree."
  loop: "{{ ceph_unique_datacenters }}"
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Assert configured room buckets exist
  ansible.builtin.assert:
    that:
      - ceph_crush_tree_json.stdout is search('"name"\\s*:\\s*"' ~ item.room ~ '"')
    fail_msg: "Missing room bucket {{ item.room }} in CRUSH tree."
  loop: "{{ ceph_room_mappings }}"
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Assert configured rack buckets exist
  ansible.builtin.assert:
    that:
      - ceph_crush_tree_json.stdout is search('"name"\\s*:\\s*"' ~ item.rack ~ '"')
    fail_msg: "Missing rack bucket {{ item.rack }} in CRUSH tree."
  loop: "{{ ceph_rack_mappings }}"
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Assert OSD hosts are represented in CRUSH tree
  ansible.builtin.assert:
    that:
      - ceph_crush_tree_json.stdout is search('"name"\\s*:\\s*"' ~ item.hostname ~ '"')
    fail_msg: "Missing OSD host {{ item.hostname }} in CRUSH tree."
  loop: "{{ ceph_location_mappings }}"
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Read Ceph daemon versions
  ansible.builtin.command: ceph versions --format json
  register: ceph_versions_json
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"

- name: Enforce Ceph daemon version
  ansible.builtin.assert:
    that:
      - ceph_versions_json.stdout is search('ceph version ' ~ ceph_version)
    fail_msg: "Ceph daemon versions do not match required {{ ceph_version }}."
  run_once: true
  delegate_to: "{{ groups['ceph_mon'][0] }}"
