- name: Check whether the cluster is already bootstrapped
  ansible.builtin.stat:
    path: /etc/ceph/ceph.conf
  register: ceph_cluster_bootstrapped

- name: Bootstrap Ceph cluster on admin node
  ansible.builtin.command: >
    cephadm --image {{ ceph_container_image }} bootstrap
    --mon-ip {{ ceph_public_ip }}
    --cluster-network {{ ceph_cluster_network_cidr }}
    --initial-dashboard-user {{ ceph_dashboard_user }}
    --initial-dashboard-password {{ ceph_dashboard_password }}
    --allow-fqdn-hostname
    --ssh-user {{ ansible_user }}
    --ssh-private-key /home/{{ ansible_user }}/.ssh/id_rsa
    --ssh-public-key /home/{{ ansible_user }}/.ssh/id_rsa.pub
  when: not ceph_cluster_bootstrapped.stat.exists

- name: Read existing orchestrator hosts
  ansible.builtin.command: ceph orch host ls --format json
  register: ceph_orch_host_ls
  changed_when: false

- name: Parse orchestrator host list
  ansible.builtin.set_fact:
    ceph_existing_hosts: "{{ (ceph_orch_host_ls.stdout | from_json) | map(attribute='hostname') | list }}"

- name: Build desired OSD target list from inventory
  ansible.builtin.set_fact:
    ceph_desired_osd_targets: >-
      {%- set ns = namespace(targets=[]) -%}
      {%- for host in groups['ceph_nodes'] -%}
      {%-   for device in hostvars[host].ceph_osd_devices -%}
      {%-     set _ = ns.targets.append({'hostname': host, 'path': device}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ ns.targets }}

- name: Ensure Ceph public network is configured
  ansible.builtin.command: ceph config set mon public_network {{ ceph_public_network_cidr }}

- name: Ensure Ceph cluster network is configured
  ansible.builtin.command: ceph config set global cluster_network {{ ceph_cluster_network_cidr }}

- name: Add missing Ceph hosts to the orchestrator
  ansible.builtin.command: ceph orch host add {{ item }} {{ hostvars[item].ceph_public_ip }}
  loop: "{{ groups['ceph_nodes'] }}"
  when: item not in ceph_existing_hosts

- name: Apply MON placement
  ansible.builtin.command: ceph orch apply mon --placement="3 ceph-node-01 ceph-node-02 ceph-node-03"

- name: Apply MGR placement
  ansible.builtin.command: ceph orch apply mgr --placement="3 ceph-node-01 ceph-node-02 ceph-node-03"

- name: Add OSD devices from inventory mapping
  ansible.builtin.command: ceph orch daemon add osd {{ item.hostname }}:{{ item.path }}
  loop: "{{ ceph_desired_osd_targets }}"
  register: ceph_osd_add_result
  failed_when:
    - ceph_osd_add_result.rc != 0
    - "'already' not in ceph_osd_add_result.stderr"
    - "'exclusively.  Mounted filesystem?' not in ceph_osd_add_result.stderr"
  changed_when: ceph_osd_add_result.rc == 0

- name: Wait for Ceph cluster to reach 3 MONs and 6 OSDs
- name: Check Ceph status until cluster is ready
  ansible.builtin.command: ceph -s --format json
  register: ceph_status_json
  changed_when: false
  retries: 30
  delay: 20
  until:
    - (ceph_status_json.stdout | from_json).monmap.num_mons | int == 3
    - (ceph_status_json.stdout | from_json).osdmap.num_up_osds | int == 6
    - (ceph_status_json.stdout | from_json).osdmap.num_in_osds | int == 6

- name: Build location mappings from inventory
  ansible.builtin.set_fact:
    ceph_location_mappings: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for host in groups['ceph_nodes'] -%}
      {%-   set location = hostvars[host].ceph_location -%}
      {%-   set _ = ns.items.append({
              'hostname': host,
              'datacenter': location.datacenter,
              'room': location.room,
              'rack': location.rack
            }) -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Build unique room to datacenter mappings
  ansible.builtin.set_fact:
    ceph_room_mappings: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for item in ceph_location_mappings -%}
      {%-   if {'room': item.room, 'datacenter': item.datacenter} not in ns.items -%}
      {%-     set _ = ns.items.append({'room': item.room, 'datacenter': item.datacenter}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Build unique rack to room mappings
  ansible.builtin.set_fact:
    ceph_rack_mappings: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for item in ceph_location_mappings -%}
      {%-   if {'rack': item.rack, 'room': item.room} not in ns.items -%}
      {%-     set _ = ns.items.append({'rack': item.rack, 'room': item.room}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Ensure datacenter buckets exist
  ansible.builtin.command: ceph osd crush add-bucket {{ item }} datacenter
  loop: "{{ ceph_location_mappings | map(attribute='datacenter') | unique | list }}"
  register: ceph_datacenter_bucket
  failed_when:
    - ceph_datacenter_bucket.rc != 0
    - "'already exists' not in ceph_datacenter_bucket.stderr"
  changed_when: "'already exists' not in ceph_datacenter_bucket.stderr"

- name: Ensure room buckets exist
  ansible.builtin.command: ceph osd crush add-bucket {{ item.room }} room
  loop: "{{ ceph_room_mappings }}"
  register: ceph_room_bucket
  failed_when:
    - ceph_room_bucket.rc != 0
    - "'already exists' not in ceph_room_bucket.stderr"
  changed_when: "'already exists' not in ceph_room_bucket.stderr"

- name: Move datacenter buckets under default root
  ansible.builtin.command: ceph osd crush move {{ item }} root=default
  loop: "{{ ceph_location_mappings | map(attribute='datacenter') | unique | list }}"

- name: Ensure rack buckets exist
  ansible.builtin.command: ceph osd crush add-bucket {{ item.rack }} rack
  loop: "{{ ceph_rack_mappings }}"
  register: ceph_rack_bucket
  failed_when:
    - ceph_rack_bucket.rc != 0
    - "'already exists' not in ceph_rack_bucket.stderr"
  changed_when: "'already exists' not in ceph_rack_bucket.stderr"

- name: Move room buckets under datacenter buckets
  ansible.builtin.command: ceph osd crush move {{ item.room }} datacenter={{ item.datacenter }}
  loop: "{{ ceph_room_mappings }}"

- name: Move rack buckets under room buckets
  ansible.builtin.command: ceph osd crush move {{ item.rack }} room={{ item.room }}
  loop: "{{ ceph_rack_mappings }}"

- name: Move hosts under rack buckets
  ansible.builtin.command: ceph osd crush move {{ item.hostname }} rack={{ item.rack }}
  loop: "{{ ceph_location_mappings }}"

- name: Ensure replicated crush rule uses rack failure domain
  ansible.builtin.command: >
    ceph osd crush rule create-replicated
    {{ ceph_rbd_crush_rule_name }}
    default
    rack
  register: ceph_crush_rule_create
  failed_when:
    - ceph_crush_rule_create.rc != 0
    - "'already exists' not in ceph_crush_rule_create.stderr"
  changed_when: "'already exists' not in ceph_crush_rule_create.stderr"

- name: Build location mappings from inventory
  ansible.builtin.set_fact:
    ceph_location_mappings: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for host in groups['ceph_nodes'] -%}
      {%-   set location = hostvars[host].ceph_location -%}
      {%-   set _ = ns.items.append({
              'hostname': host,
              'datacenter': location.datacenter,
              'room': location.room,
              'rack': location.rack
            }) -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Build unique room to datacenter mappings
  ansible.builtin.set_fact:
    ceph_room_mappings: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for item in ceph_location_mappings -%}
      {%-   if {'room': item.room, 'datacenter': item.datacenter} not in ns.items -%}
      {%-     set _ = ns.items.append({'room': item.room, 'datacenter': item.datacenter}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Build unique rack to room mappings
  ansible.builtin.set_fact:
    ceph_rack_mappings: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for item in ceph_location_mappings -%}
      {%-   if {'rack': item.rack, 'room': item.room} not in ns.items -%}
      {%-     set _ = ns.items.append({'rack': item.rack, 'room': item.room}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Ensure datacenter buckets exist
  ansible.builtin.command: ceph osd crush add-bucket {{ item }} datacenter
  loop: "{{ ceph_location_mappings | map(attribute='datacenter') | unique | list }}"
  register: ceph_datacenter_bucket
  failed_when:
    - ceph_datacenter_bucket.rc != 0
    - "'already exists' not in ceph_datacenter_bucket.stderr"
  changed_when: "'already exists' not in ceph_datacenter_bucket.stderr"

- name: Ensure room buckets exist
  ansible.builtin.command: ceph osd crush add-bucket {{ item.room }} room
  loop: "{{ ceph_room_mappings }}"
  register: ceph_room_bucket
  failed_when:
    - ceph_room_bucket.rc != 0
    - "'already exists' not in ceph_room_bucket.stderr"
  changed_when: "'already exists' not in ceph_room_bucket.stderr"

- name: Ensure rack buckets exist
  ansible.builtin.command: ceph osd crush add-bucket {{ item.rack }} rack
  loop: "{{ ceph_rack_mappings }}"
  register: ceph_rack_bucket
  failed_when:
    - ceph_rack_bucket.rc != 0
    - "'already exists' not in ceph_rack_bucket.stderr"
  changed_when: "'already exists' not in ceph_rack_bucket.stderr"

- name: Move room buckets under datacenter buckets
  ansible.builtin.command: ceph osd crush move {{ item.room }} datacenter={{ item.datacenter }}
  loop: "{{ ceph_room_mappings }}"

- name: Move rack buckets under room buckets
  ansible.builtin.command: ceph osd crush move {{ item.rack }} room={{ item.room }}
  loop: "{{ ceph_rack_mappings }}"

- name: Move hosts under rack buckets
  ansible.builtin.command: ceph osd crush move {{ item.hostname }} rack={{ item.rack }}
  loop: "{{ ceph_location_mappings }}"

- name: Ensure replicated crush rule uses rack failure domain
  ansible.builtin.command: >
    ceph osd crush rule create-replicated
    {{ ceph_rbd_crush_rule_name }}
    dc1
    rack
  register: ceph_crush_rule_create
  failed_when:
    - ceph_crush_rule_create.rc != 0
    - "'already exists' not in ceph_crush_rule_create.stderr"
  changed_when: "'already exists' not in ceph_crush_rule_create.stderr"

- name: Verify MON quorum
  ansible.builtin.command: ceph mon stat
  changed_when: false

- name: Verify OSD tree
  ansible.builtin.command: ceph osd tree
  changed_when: false

- name: Read Ceph daemon versions
  ansible.builtin.command: ceph versions --format json
  register: ceph_versions_json
  changed_when: false

- name: Enforce Ceph daemon version
  ansible.builtin.assert:
    that:
      - "'ceph version {{ ceph_version }}' in ceph_versions_json.stdout"
    fail_msg: "Ceph daemon versions do not match required {{ ceph_version }}."
