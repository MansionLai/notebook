all:
  children:
    # MON nodes: stores cluster state and metadata
    ceph_mon:
      hosts:
        ceph-node-01:
          ansible_host: 20.222.22.46
          ceph_public_ip: 10.10.10.21
        ceph-node-02:
          ansible_host: 20.210.236.64
          ceph_public_ip: 10.10.10.22
        ceph-node-03:
          ansible_host: 20.46.183.80
          ceph_public_ip: 10.10.10.23

    # OSD nodes: stores data with cluster network
    ceph_osd:
      hosts:
        ceph-node-01:
          ansible_host: 20.222.22.46
          ceph_public_ip: 10.10.10.21
          ceph_cluster_ip: 172.10.10.21
          ceph_location:
            datacenter: dc1
            room: room1
            rack: rack1
        ceph-node-02:
          ansible_host: 20.210.236.64
          ceph_public_ip: 10.10.10.22
          ceph_cluster_ip: 172.10.10.22
          ceph_location:
            datacenter: dc1
            room: room1
            rack: rack2
        ceph-node-03:
          ansible_host: 20.46.183.80
          ceph_public_ip: 10.10.10.23
          ceph_cluster_ip: 172.10.10.23
          ceph_location:
            datacenter: dc1
            room: room1
            rack: rack3
      vars:
        ceph_osd_devices:
          - /dev/disk/azure/scsi1/lun0
          - /dev/disk/azure/scsi1/lun1

    # Admin nodes: can manage cluster (ceph admin commands)
    ceph_admin:
      hosts:
        ceph-node-01:
          ansible_host: 20.222.22.46
          ceph_public_ip: 10.10.10.21
        ceph-node-02:
          ansible_host: 20.210.236.64
          ceph_public_ip: 10.10.10.22
        ceph-node-03:
          ansible_host: 20.46.183.80
          ceph_public_ip: 10.10.10.23

    # Convenience group: all ceph nodes (MON + OSD)
    ceph_nodes:
      children:
        ceph_mon:
        ceph_osd:
