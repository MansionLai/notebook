<style>
  .topic-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 0 0 1rem;
    padding: 0 0 0.75rem;
    border-bottom: 1px solid var(--border-color, #d0d7de);
  }

  .topic-tabs__link {
    display: inline-flex;
    align-items: center;
    padding: 0.45rem 0.8rem;
    border-bottom: 3px solid transparent;
    color: inherit;
    font-weight: 600;
    text-decoration: none;
  }

  .topic-tabs__link:hover {
    color: var(--link-color, #005cc5);
    border-bottom-color: var(--link-color, #005cc5);
  }

  .topic-tabs__link.is-active {
    color: var(--link-color, #005cc5);
    border-bottom-color: var(--link-color, #005cc5);
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const mainContent = document.querySelector(".main-content");
    if (!mainContent || !mainContent.parentNode) return;

    const topics = [
      {% for topic in site.data.topics %}
      {
        title: {{ topic.title | jsonify }},
        url: {{ topic.url | relative_url | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ];

    // 優化：處理路徑，移除 baseurl，並正規化斜線
    const baseUrl = {{ site.baseurl | jsonify }};
    const normalize = (path) => {
        let p = path.replace(new RegExp('^' + baseUrl), "").replace(/\/+$/, "").replace(/^\/+/, "/");
        return p === "" ? "/" : p;
    };
    
    const currentPath = normalize(window.location.pathname);

    const tabs = document.createElement("nav");
    tabs.className = "topic-tabs";
    tabs.setAttribute("aria-label", "Notebook topics");

    topics.forEach(({ title, url }) => {
      const link = document.createElement("a");
      const linkPath = normalize(url);
      
      link.className = "topic-tabs__link";
      link.href = url;
      link.textContent = title;
      
      // 改進匹配邏輯：精確匹配或子目錄匹配
      if (currentPath === linkPath || (linkPath !== "/" && currentPath.startsWith(linkPath + "/"))) {
        link.classList.add("is-active");
        link.setAttribute("aria-current", "page");
      }
      tabs.appendChild(link);
    });

    mainContent.parentNode.insertBefore(tabs, mainContent);
  });
</script>
