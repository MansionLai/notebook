<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        
        const MotionLib = window.Motion || window.FramerMotion;
        const { motion, AnimatePresence } = MotionLib || { motion: (props) => <div {...props} />, AnimatePresence: ({children}) => children };

        // --- Icons Wrapper (Improved for CDN reliability) ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                const timer = setInterval(() => {
                    if (window.lucide && window.lucide.createIcons && iconRef.current) {
                        window.lucide.createIcons({
                            attrs: {
                                class: className,
                                'stroke-width': 2,
                                'width': size,
                                'height': size
                            },
                            nameAttr: 'data-lucide'
                        });
                        clearInterval(timer);
                    }
                }, 100);
                return () => clearInterval(timer);
            }, [name, size, className]);
            
            return (
                <div className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}>
                    <i ref={iconRef} data-lucide={name} style={{ width: size, height: size }}></i>
                </div>
            );
        };

        // --- VRRP Animation Component ---
        const VRRPAnimation = () => {
            const [isMasterAlive, setIsMasterAlive] = useState(true);
            const [showPacket, setShowPacket] = useState(false);

            useEffect(() => {
                let packetInterval;
                if (isMasterAlive) {
                    packetInterval = setInterval(() => {
                        setShowPacket(true);
                        setTimeout(() => setShowPacket(false), 1000);
                    }, 2000);
                }
                return () => clearInterval(packetInterval);
            }, [isMasterAlive]);

            return (
                <div className="flex flex-col items-center w-full space-y-12 py-8">
                    <div className="flex justify-between items-center w-full max-w-3xl relative px-12">
                        {/* Master Node */}
                        <div className="flex flex-col items-center z-10">
                            <motion.div 
                                animate={{ 
                                    scale: isMasterAlive ? [1, 1.05, 1] : 1,
                                    opacity: isMasterAlive ? 1 : 0.4 
                                }}
                                transition={{ repeat: Infinity, duration: 2 }}
                                className={`w-32 h-32 rounded-3xl flex flex-col items-center justify-center border-2 transition-colors ${isMasterAlive ? 'border-emerald-500 bg-emerald-500/10' : 'border-red-500 bg-red-500/10'}`}
                            >
                                <Icon name={isMasterAlive ? "shield-check" : "shield-alert"} size={48} className={isMasterAlive ? "text-emerald-400" : "text-red-400"} />
                                <span className="text-xs font-bold mt-2">MASTER</span>
                            </motion.div>
                            <span className="text-[10px] mt-2 font-mono text-white/40">192.168.50.211</span>
                        </div>

                        {/* Packet Animation */}
                        <AnimatePresence>
                            {showPacket && (
                                <motion.div 
                                    initial={{ x: 0, opacity: 0 }}
                                    animate={{ x: 300, opacity: 1 }}
                                    exit={{ opacity: 0 }}
                                    transition={{ duration: 1, ease: "linear" }}
                                    className="absolute left-[160px] top-12 z-0"
                                >
                                    <div className="flex flex-col items-center">
                                        <div className="px-3 py-1 bg-blue-500 rounded-full text-[8px] font-bold text-white shadow-lg shadow-blue-500/20 whitespace-nowrap">
                                            VRRP ADVERTISEMENT
                                        </div>
                                        <div className="w-2 h-2 bg-blue-400 rounded-full mt-1 animate-ping"></div>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        {/* Connection Line */}
                        <div className="absolute top-16 left-0 right-0 h-[2px] bg-white/5 -z-10"></div>

                        {/* Backup Node */}
                        <div className="flex flex-col items-center z-10">
                            <motion.div 
                                animate={{ 
                                    borderColor: !isMasterAlive ? "#10b981" : "rgba(255,255,255,0.1)",
                                    backgroundColor: !isMasterAlive ? "rgba(16,185,129,0.1)" : "rgba(255,255,255,0.03)"
                                }}
                                className="w-32 h-32 rounded-3xl flex flex-col items-center justify-center border-2 glass"
                            >
                                <Icon name={!isMasterAlive ? "shield-check" : "clock"} size={48} className={!isMasterAlive ? "text-emerald-400" : "text-white/20"} />
                                <span className="text-xs font-bold mt-2 uppercase">{!isMasterAlive ? "New Master" : "Backup"}</span>
                            </motion.div>
                            <span className="text-[10px] mt-2 font-mono text-white/40">192.168.50.212</span>
                        </div>
                    </div>

                    <div className="flex gap-4">
                        <button 
                            onClick={() => setIsMasterAlive(!isMasterAlive)}
                            className={`px-6 py-2 rounded-full font-bold text-xs transition-all ${isMasterAlive ? 'bg-red-500 hover:bg-red-600' : 'bg-emerald-500 hover:bg-emerald-600'}`}

                        </button>

                    <div className="glass p-6 rounded-2xl border-white/5 max-w-xl text-center">

                        </p>
                    </div>
                </div>
            );

                                <div>

                                </div>

                        </div>
                        <div className="glass rounded-3xl p-8 border-white/5 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 blur-3xl rounded-full"></div>
                            <div className="relative z-10 space-y-4">
                                <h5 className="text-xs font-mono text-white/30 uppercase tracking-widest">Configuration Logic</h5>
                                <div className="p-4 bg-white/5 rounded-xl border border-white/10 font-mono text-xs text-blue-300">
                                    frontend k8s-api<br/>

                            </div>
                        </div>
                    </div>
                )
            },
            {
                id: 'keepalived-vrrp',
                title: 'VRRP Mechanism',
                subtitle: 'Keepalived 核心原理',
                description: '透過 VRRP 廣告實現「故障即時感知」與「VIP 無縫遷移」',
                gradient: 'gradient-purple',
                icon: 'activity',

            },
            {
                id: 'keepalived-config',
                title: 'Keepalived Configuration',
                subtitle: '關鍵參數詳解',
                description: '深入理解 keepalived.conf 的核心設定選項',
                gradient: 'gradient-slate',
                icon: 'settings',
                content: (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="p-6 glass rounded-3xl space-y-4 border-white/5 overflow-y-auto max-h-[400px]">
                            <h5 className="text-blue-400 font-bold flex items-center gap-2"><Icon name="code" size={18}/> vrrp_instance VI_1</h5>
                            <div className="space-y-4 text-xs font-mono">
                                <div className="config-grid">
                                    <span className="text-purple-400">state</span>
                                    <span className="text-white/60">節點初始狀態 (MASTER/BACKUP)。由 Priority 決定最終角色。</span>

                                </div>
                                <div className="config-grid">

                                </div>
                                <div className="config-grid">
                                    <span className="text-purple-400">advert_int</span>
                                    <span className="text-white/60">廣告間隔秒數 (預設 1s)。</span>
                                </div>
                                <div className="config-grid">
                                    <span className="text-purple-400">auth_pass</span>

                        <div className="space-y-6">

                                <p className="text-sm text-white/60 leading-relaxed">

                                </p>
                            </div>
                            <div className="p-6 glass rounded-3xl border-purple-500/20">
                                <h5 className="text-purple-400 font-bold mb-3 flex items-center gap-2"><Icon name="file-search" size={18}/> track_script</h5>
                                <p className="text-sm text-white/60 leading-relaxed">

                                </p>
                            </div>
                        </div>
                    </div>
                )
            },
            {
                id: 'synergy',
                title: 'Better Together',
                subtitle: '相輔相成的關鍵角色',
                description: 'Keepalived 解決 HAProxy 自身的單點故障問題，HAProxy 解決 API Server 的負載均衡問題',
                gradient: 'gradient-emerald',
                icon: 'users',
                content: (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="p-6 glass rounded-3xl space-y-4">
                            <div className="p-3 bg-blue-500/20 rounded-xl w-fit"><Icon name="map-pin" className="text-blue-400" /></div>
                            <h5 className="font-bold">Single Entry Point</h5>
                            <p className="text-sm text-white/70">Keepalived 提供穩定的 VIP，作為 kube-apiserver 的統一存取位址</p>
                        </div>
                        <div className="p-6 glass rounded-3xl space-y-4 border-emerald-500/30">
                            <div className="p-3 bg-emerald-500/20 rounded-xl w-fit"><Icon name="git-merge" className="text-emerald-400" /></div>

                            <h5 className="font-bold">Double Reliability</h5>
                            <p className="text-sm text-white/70">即便某台負載均衡器故障，服務仍能秒級切換，維持叢集正常運作</p>

                                <span className="text-xs font-bold text-emerald-400">Keepalived</span>

                            <div className="text-center">

        // --- Components ---
        const App = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            const [direction, setDirection] = useState(0);

            const nextSlide = useCallback(() => {
                if (currentSlide < slides.length - 1) {
                    setDirection(1);
                    setCurrentSlide(prev => prev + 1);
                }
            }, [currentSlide]);

            const prevSlide = useCallback(() => {
                if (currentSlide > 0) {
                    setDirection(-1);
                    setCurrentSlide(prev => prev - 1);
                }
            }, [currentSlide]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
                    if (e.key === 'ArrowLeft') prevSlide();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [nextSlide, prevSlide]);

            const slide = slides[currentSlide];

            return (
                <div className={`h-screen w-screen overflow-hidden relative transition-colors duration-1000 ${slide.gradient}`}>
                    {/* Background decoration */}
                    <div className="absolute inset-0 opacity-20 pointer-events-none">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-500 rounded-full blur-[120px]"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-500 rounded-full blur-[120px]"></div>
                    </div>

                    <div className="relative z-10 h-full flex flex-col p-12 max-w-7xl mx-auto">
                        {/* Header */}
                        <header className="flex justify-between items-center mb-16">
                            <div className="flex items-center gap-4">
                                <div className="p-3 glass rounded-2xl flex items-center justify-center">
                                    <Icon name={slide.icon} className="text-white" size={24} />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black tracking-tighter uppercase leading-none">{slide.title}</h1>
                                    <p className="text-[10px] text-white/50 font-mono mt-1 uppercase tracking-widest">{slide.subtitle}</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {slides.map((_, i) => (
                                    <div 
                                        key={i} 
                                        className={`h-1 rounded-full transition-all duration-300 ${i === currentSlide ? 'w-8 bg-white' : 'w-2 bg-white/20'}`}
                                    />
                                ))}
                            </div>
                        </header>

                        {/* Main Content */}
                        <main className="flex-1 relative overflow-hidden flex flex-col justify-center">
                            <AnimatePresence mode="wait" custom={direction}>
                                <motion.div
                                    key={currentSlide}
                                    custom={direction}
                                    initial={{ opacity: 0, x: direction * 50, scale: 0.95 }}
                                    animate={{ opacity: 1, x: 0, scale: 1 }}
                                    exit={{ opacity: 0, x: direction * -50, scale: 1.05 }}
                                    transition={{ duration: 0.4, ease: [0.16, 1, 0.3, 1] }}
                                    className="w-full"
                                >
                                    <div className="mb-12 max-w-2xl">
                                        <motion.p 
                                            initial={{ opacity: 0, y: 10 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            transition={{ delay: 0.2 }}
                                            className="text-lg text-white/80 leading-relaxed font-light"
                                        >
                                            {slide.description}
                                        </motion.p>
                                    </div>
                                    <motion.div 
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: 0.3 }}
                                    >
                                        {slide.content}
                                    </motion.div>
                                </motion.div>
                            </AnimatePresence>
                        </main>

                        {/* Footer / Controls */}
                        <footer className="mt-16 flex justify-between items-center border-t border-white/10 pt-8">
                            <div className="text-[10px] font-mono text-white/20 uppercase tracking-[0.2em]">
                                Keepalived & HAProxy • K8s Load Balancing • Phase 0
                            </div>
                            <div className="flex gap-4">
                                <button 
                                    onClick={prevSlide}
                                    disabled={currentSlide === 0}
                                    className={`p-4 rounded-full glass transition-all ${currentSlide === 0 ? 'opacity-20' : 'hover:bg-white/10 active:scale-90'}`}
                                >
                                    <Icon name="chevron-left" />
                                </button>
                                <button 
                                    onClick={nextSlide}
                                    disabled={currentSlide === slides.length - 1}
                                    className={`p-4 rounded-full glass transition-all ${currentSlide === slides.length - 1 ? 'opacity-20' : 'hover:bg-white/10 active:scale-90'}`}
                                >
                                    <Icon name="chevron-right" />
                                </button>
                            </div>
                        </footer>
                    </div>

                    {/* Page Number Indicator */}
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-xs font-mono text-white/10">
                        {String(currentSlide + 1).padStart(2, '0')} / {String(slides.length).padStart(2, '0')}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
