<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepalived & HAProxy Presentation</title>
    <link rel="icon" type="image/svg+xml" href="/notebook/load-balancer/slides/favicon.svg" />
    <!-- Tailwind CSS 3.4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Framer Motion & React (via CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            overflow: hidden;
            margin: 0;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-blue {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 50%, #000 100%);
        }

        .gradient-purple {
            background: linear-gradient(135deg, #4c1d95 0%, #2e1065 50%, #000 100%);
        }

        .gradient-emerald {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 50%, #000 100%);
        }

        .gradient-slate {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #000 100%);
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 1rem;
        }

        /* Prevent text truncation in some browsers */
        .slide-content-container {
            max-height: 70vh;
            overflow-y: auto;
            scrollbar-width: none;
        }
        
        .code-block {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #93c5fd;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        
        const MotionLib = window.Motion || window.FramerMotion;
        const { motion, AnimatePresence } = MotionLib || { motion: (props) => <div {...props} />, AnimatePresence: ({children}) => children };

        // --- Icons Wrapper ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                const timer = setInterval(() => {
                    if (window.lucide && window.lucide.createIcons && iconRef.current) {
                        window.lucide.createIcons({
                            attrs: {
                                class: className,
                                'stroke-width': 2,
                                'width': size,
                                'height': size
                            },
                            nameAttr: 'data-lucide'
                        });
                        clearInterval(timer);
                    }
                }, 100);
                return () => clearInterval(timer);
            }, [name, size, className]);
            
            return (
                <div className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}>
                    <i ref={iconRef} data-lucide={name} style={{ width: size, height: size }}></i>
                </div>
            );
        };

        // --- VRRP Animation Component ---
        const VRRPAnimation = () => {
            const [isMasterAlive, setIsMasterAlive] = useState(true);
            const [showPacket, setShowPacket] = useState(false);
            const [showGARP, setShowGARP] = useState(false);

            useEffect(() => {
                const packetInterval = setInterval(() => {
                    setShowPacket(true);
                    setTimeout(() => setShowPacket(false), 1200);
                }, 2500);
                return () => clearInterval(packetInterval);
            }, [isMasterAlive]);

            // Trigger GARP animation when status changes
            useEffect(() => {
                setShowGARP(true);
                const timer = setTimeout(() => setShowGARP(false), 1500);
                return () => clearTimeout(timer);
            }, [isMasterAlive]);

            return (
                <div className="flex flex-col items-center w-full space-y-12 py-4">
                    {/* Network Switch Layer */}
                    <div className="flex flex-col items-center mb-4">
                        <div className="p-4 glass rounded-3xl border-blue-500/30 flex flex-col items-center w-48 relative">
                            <Icon name="network" size={40} className="text-blue-400" />
                            <span className="text-[10px] font-black mt-2 text-white/50 tracking-widest uppercase">L2 Switch</span>
                            
                            {/* GARP Reception Visual */}
                            <AnimatePresence>
                                {showGARP && (
                                    <motion.div 
                                        initial={{ scale: 0.8, opacity: 0 }}
                                        animate={{ scale: 1.2, opacity: 1 }}
                                        exit={{ scale: 1.5, opacity: 0 }}
                                        className="absolute -top-2 bg-emerald-500/20 border border-emerald-500/50 px-2 py-0.5 rounded text-[8px] text-emerald-400 font-bold"
                                    >
                                        CAM TABLE UPDATED
                                    </motion.div>
                                )}
                            </AnimatePresence>
                        </div>
                    </div>

                    <div className="flex justify-between items-center w-full max-w-3xl relative px-12">
                        {/* LB-1 Node */}
                        <div className="flex flex-col items-center z-10">
                            <motion.div 
                                animate={{ 
                                    scale: isMasterAlive ? [1, 1.05, 1] : 1,
                                    opacity: isMasterAlive ? 1 : 0.4 
                                }}
                                transition={{ repeat: Infinity, duration: 2 }}
                                className={`w-32 h-32 rounded-3xl flex flex-col items-center justify-center border-2 transition-colors relative ${isMasterAlive ? 'border-emerald-500 bg-emerald-500/10' : 'border-red-500 bg-red-500/10'}`}
                            >
                                {isMasterAlive && (
                                    <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-emerald-500 text-[10px] font-black px-3 py-0.5 rounded-full text-black shadow-lg shadow-emerald-500/50">VIP ACTIVE</div>
                                )}
                                <Icon name={isMasterAlive ? "shield-check" : "shield-alert"} size={48} className={isMasterAlive ? "text-emerald-400" : "text-red-400"} />
                                <span className="text-xs font-bold mt-2 font-mono">LB-1 (Pri: 100)</span>
                            </motion.div>
                            <span className="text-[10px] mt-2 font-mono text-white/40">192.168.50.211</span>
                        </div>

                        {/* GARP Packet Animation */}
                        <AnimatePresence>
                            {showGARP && (
                                <motion.div 
                                    initial={{ y: 80, x: isMasterAlive ? -160 : 160, opacity: 0 }}
                                    animate={{ y: -100, x: 0, opacity: 1 }}
                                    transition={{ duration: 0.8, ease: "easeOut" }}
                                    className="absolute left-1/2 top-12 z-20"
                                >
                                    <div className="flex flex-col items-center">
                                        <div className="px-3 py-1 bg-emerald-500 rounded-full text-[8px] font-black text-black shadow-lg whitespace-nowrap">
                                            GRATUITOUS ARP
                                        </div>
                                        <div className="w-2 h-2 bg-emerald-400 rounded-full mt-1 animate-ping"></div>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        {/* Unicast Packet Animation */}
                        <AnimatePresence>
                            {showPacket && (
                                <motion.div 
                                    initial={{ x: isMasterAlive ? 0 : 300, opacity: 0 }}
                                    animate={{ x: isMasterAlive ? 300 : 0, opacity: 1 }}
                                    exit={{ opacity: 0 }}
                                    transition={{ duration: 1.2, ease: "easeInOut" }}
                                    className="absolute left-[160px] top-12 z-0"
                                >
                                    <div className="flex flex-col items-center">
                                        <div className="px-3 py-1 bg-blue-500/80 rounded-full text-[8px] font-bold text-white shadow-lg shadow-blue-500/20 whitespace-nowrap border border-blue-400/30">
                                            {isMasterAlive ? "LB-1 -> LB-2 (ADVERT)" : "LB-2 -> LB-1 (ADVERT)"}
                                        </div>
                                        <div className={`w-2 h-2 rounded-full mt-1 animate-pulse ${isMasterAlive ? 'bg-blue-400' : 'bg-emerald-400'}`}></div>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        {/* Connection Line */}
                        <div className="absolute top-16 left-0 right-0 h-[2px] bg-white/5 -z-10"></div>

                        {/* LB-2 Node */}
                        <div className="flex flex-col items-center z-10">
                            <motion.div 
                                animate={{ 
                                    borderColor: !isMasterAlive ? "#10b981" : "rgba(255,255,255,0.1)",
                                    backgroundColor: !isMasterAlive ? "rgba(16,185,129,0.1)" : "rgba(255,255,255,0.03)",
                                    scale: !isMasterAlive ? [1, 1.05, 1] : 1
                                }}
                                transition={!isMasterAlive ? { repeat: Infinity, duration: 2 } : {}}
                                className="w-32 h-32 rounded-3xl flex flex-col items-center justify-center border-2 glass relative"
                            >
                                {!isMasterAlive && (
                                    <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-emerald-500 text-[10px] font-black px-3 py-0.5 rounded-full text-black shadow-lg shadow-emerald-500/50">VIP ACTIVE</div>
                                )}
                                <Icon name={!isMasterAlive ? "shield-check" : "clock"} size={48} className={!isMasterAlive ? "text-emerald-400" : "text-white/20"} />
                                <span className="text-xs font-bold mt-2 font-mono uppercase">LB-2 (Pri: 50)</span>
                            </motion.div>
                            <span className="text-[10px] mt-2 font-mono text-white/40">192.168.50.212</span>
                        </div>
                    </div>

                    <div className="flex gap-4">
                        <button 
                            onClick={() => setIsMasterAlive(!isMasterAlive)}
                            className={`px-8 py-3 rounded-full font-black text-xs uppercase tracking-widest transition-all ${isMasterAlive ? 'bg-red-500 hover:bg-red-600 shadow-lg shadow-red-500/20' : 'bg-emerald-500 hover:bg-emerald-600 shadow-lg shadow-emerald-500/20'}`}
                        >
                            {isMasterAlive ? "Kill LB-1 (Trigger GARP)" : "Restore LB-1 (Trigger GARP)"}
                        </button>
                    </div>

                    <div className="glass p-6 rounded-2xl border-white/5 max-w-xl text-center">
                        <p className="text-sm text-white/70 italic leading-relaxed">
                            {isMasterAlive 
                                ? "LB-1 正常運行，持續發送 ADVERT 告知 LB-2 自己仍是 Master。VIP 綁定在 LB-1。" 
                                : "LB-1 故障，LB-2 接管 VIP 並立即發送 Gratuitous ARP 通知 Switch 更新 MAC 位址，隨後開始發送 ADVERT。"}
                        </p>
                    </div>
                </div>
            );
        };

        // --- Data Definitions ---
        const slides = [
            {
                id: 'hero',
                title: 'Keepalived & HAProxy',
                subtitle: 'High Availability Load Balancer',
                description: '在 Kubernetes 叢集實現穩定、可靠的 API Server 高可用架構',
                gradient: 'gradient-blue',
                icon: 'shield-check',
                content: (
                    <div className="flex flex-col items-center justify-center text-center space-y-8">
                        <div className="flex gap-6">
                            <div className="px-6 py-2 glass rounded-full text-blue-400 font-mono text-sm">VRRP Failover</div>
                            <div className="px-6 py-2 glass rounded-full text-purple-400 font-mono text-sm">L4/L7 Load Balancing</div>
                        </div>
                        <div className="mt-12 grid grid-cols-3 gap-8 w-full max-w-4xl">
                            <div className="p-6 glass rounded-3xl text-center">
                                <Icon name="activity" className="mx-auto mb-4 text-blue-400" size={32} />
                                <h4 className="font-bold">Keepalived</h4>
                                <p className="text-xs text-white/50 mt-2">VIP Management</p>
                            </div>
                            <div className="p-6 glass rounded-3xl text-center border-blue-500/30">
                                <Icon name="repeat" className="mx-auto mb-4 text-purple-400" size={32} />
                                <h4 className="font-bold">HAProxy</h4>
                                <p className="text-xs text-white/50 mt-2">Traffic Distribution</p>
                            </div>
                            <div className="p-6 glass rounded-3xl text-center">
                                <Icon name="server" className="mx-auto mb-4 text-emerald-400" size={32} />
                                <h4 className="font-bold">K8s API</h4>
                                <p className="text-xs text-white/50 mt-2">High Availability</p>
                            </div>
                        </div>
                    </div>
                )
            },
            {
                id: 'haproxy',
                title: 'HAProxy',
                subtitle: '高性能負載均衡器',
                description: '提供極致效能的 TCP 與 HTTP 轉發能力，支援健康檢查與多種調度算法',
                gradient: 'gradient-slate',
                icon: 'zap',
                content: (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                        <div className="space-y-6">
                            <div className="flex gap-4 items-start">
                                <div className="p-3 bg-blue-500/20 rounded-xl"><Icon name="cpu" className="text-blue-400" /></div>
                                <div>
                                    <h4 className="font-bold text-lg">L4/L7 負載均衡</h4>
                                    <p className="text-sm text-white/60 leading-relaxed">針對 K8s API Server (6443) 進行 TCP 層級的高效轉發，確保控制平面通訊低延遲</p>
                                </div>
                            </div>
                            <div className="flex gap-4 items-start">
                                <div className="p-3 bg-green-500/20 rounded-xl"><Icon name="heart" className="text-green-400" /></div>
                                <div>
                                    <h4 className="font-bold text-lg">主動健康檢查</h4>
                                    <p className="text-sm text-white/60 leading-relaxed">自動偵測並剔除故障的 API Server 節點，實現服務自我修復</p>
                                </div>
                            </div>
                            <div className="flex gap-4 items-start">
                                <div className="p-3 bg-purple-500/20 rounded-xl"><Icon name="bar-chart" className="text-purple-400" /></div>
                                <div>
                                    <h4 className="font-bold text-lg">豐富的統計介面</h4>
                                    <p className="text-sm text-white/60 leading-relaxed">內建 Stats 頁面，即時監控後端節點負載、連線數與流量分佈</p>
                                </div>
                            </div>
                        </div>
                        <div className="glass rounded-3xl p-8 border-white/5 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 blur-3xl rounded-full"></div>
                            <div className="relative z-10 space-y-4">
                                <h5 className="text-xs font-mono text-white/30 uppercase tracking-widest">Configuration Logic</h5>
                                <div className="p-4 bg-white/5 rounded-xl border border-white/10 font-mono text-xs text-blue-300">
                                    frontend k8s-api<br/>
                                    &nbsp;&nbsp;bind *:6443<br/>
                                    &nbsp;&nbsp;default_backend k8s-masters
                                </div>
                                <div className="flex justify-center py-4">
                                    <Icon name="arrow-down" className="text-white/20" size={40} />
                                </div>
                                <div className="p-4 bg-blue-500/20 rounded-xl border border-blue-500/30 font-mono text-xs text-center">
                                    backend k8s-masters<br/>
                                    &nbsp;&nbsp;balance roundrobin<br/>
                                    &nbsp;&nbsp;server master1 10.0.0.1:6443 check
                                </div>
                            </div>
                        </div>
                    </div>
                )
            },
            {
                id: 'keepalived-vrrp',
                title: 'VRRP Mechanism',
                subtitle: 'Keepalived 核心原理',
                description: '透過 VRRP ADVERT 與 Gratuitous ARP 實現 VIP 的物理位置遷移',
                gradient: 'gradient-purple',
                icon: 'activity',
                content: <VRRPAnimation />
            },
            {
                id: 'keepalived-config',
                title: 'Keepalived Configuration',
                subtitle: '關鍵參數詳解',
                description: '位於 /etc/keepalived/keepalived.conf 的核心設定',
                gradient: 'gradient-slate',
                icon: 'settings',
                content: (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                        <div className="space-y-6">
                            <div className="p-6 glass rounded-3xl border-white/5">
                                <h5 className="text-blue-400 font-bold mb-4 flex items-center gap-2 text-sm"><Icon name="file-code" size={18}/> Configuration Sample (BACKUP)</h5>
                                <div className="code-block whitespace-pre overflow-x-auto text-[10px]">
{`vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 50
    advert_int 1
    nopreempt
    unicast_src_ip 192.168.50.212
    unicast_peer { 192.168.50.211 }
    authentication {
        auth_type PASS
        auth_pass 1111
    }
    virtual_ipaddress {
        192.168.50.250/24
    }
    track_script { check_haproxy }
}`}
                                </div>
                            </div>
                            <div className="p-4 glass rounded-2xl border-blue-500/20">
                                <p className="text-[10px] text-white/50 italic leading-relaxed">
                                    * 建議兩台皆設為 <code className="text-blue-300">BACKUP</code> 並配合 <code className="text-blue-300">nopreempt</code>，可避免 Master 修復後發生不必要的二次切換 (Preemption)。
                                </p>
                            </div>
                        </div>
                        <div className="p-6 glass rounded-3xl space-y-4 border-white/5 overflow-y-auto max-h-[480px]">
                            <h5 className="text-emerald-400 font-bold flex items-center gap-2 text-sm"><Icon name="info" size={18}/> 參數詳解</h5>
                            <div className="space-y-4 text-xs font-mono">
                                <div className="config-grid border-b border-white/5 pb-2">
                                    <span className="text-purple-400 font-bold">nopreempt</span>
                                    <span className="text-white/60">不搶佔模式。當原 Master 恢復時，不會強制搶回 VIP，減少服務中斷。</span>
                                </div>
                                <div className="config-grid border-b border-white/5 pb-2">
                                    <span className="text-purple-400 font-bold">state</span>
                                    <span className="text-white/60">初始狀態。在 nopreempt 模式下，建議雙方都設為 BACKUP。</span>
                                </div>
                                <div className="config-grid border-b border-white/5 pb-2">
                                    <span className="text-purple-400 font-bold">priority</span>
                                    <span className="text-white/60">競選權重。數值高者勝出。</span>
                                </div>
                                <div className="config-grid border-b border-white/5 pb-2">
                                    <span className="text-purple-400 font-bold">unicast_peer</span>
                                    <span className="text-white/60">單播對手。指定具體的對端 IP，避免 Multicast 廣播風暴。</span>
                                </div>
                                <div className="config-grid border-b border-white/5 pb-2">
                                    <span className="text-purple-400 font-bold">virtual_ip</span>
                                    <span className="text-white/60">漂移 IP。外部存取的唯一入口。</span>
                                </div>
                            </div>
                        </div>
                    </div>
                )
            },
            {
                id: 'architecture',
                title: 'Architecture Flow',
                subtitle: '流量傳遞路徑',
                description: '從 kubectl 客戶端到後端 3 台 API Server 的完整負載均衡路徑',
                gradient: 'gradient-blue',
                icon: 'network',
                content: (
                    <div className="flex flex-col items-center space-y-12 py-4">
                        <div className="flex flex-col md:flex-row items-center gap-8 w-full justify-center">
                            {/* Tier 1: Client */}
                            <div className="flex flex-col items-center">
                                <div className="w-16 h-16 glass rounded-2xl flex items-center justify-center mb-2 text-blue-400 border-blue-500/30"><Icon name="terminal" size={32} /></div>
                                <span className="text-[10px] font-black uppercase tracking-widest text-white/60">Client</span>
                            </div>

                            <Icon name="arrow-right" className="text-white/10 hidden md:block" />

                            {/* Tier 2: LB Cluster */}
                            <div className="p-6 glass rounded-3xl border-white/10 relative">
                                <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-emerald-500 text-[10px] font-black px-4 py-0.5 rounded-full text-black">VIP: 192.168.50.250</div>
                                <div className="flex gap-4">
                                    <div className="text-center">
                                        <div className="w-14 h-14 bg-emerald-500/20 rounded-xl flex items-center justify-center mb-2 border border-emerald-500/50 relative">
                                            <div className="absolute top-0 right-0 w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                                            <Icon name="layers" size={24} className="text-emerald-400" />
                                        </div>
                                        <span className="text-[8px] font-mono text-white/50">LB-1 (Active)</span>
                                    </div>
                                    <div className="text-center opacity-40">
                                        <div className="w-14 h-14 glass rounded-xl flex items-center justify-center mb-2 border border-white/10">
                                            <Icon name="layers" size={24} />
                                        </div>
                                        <span className="text-[8px] font-mono">LB-2 (Standby)</span>
                                    </div>
                                </div>
                                <div className="text-center mt-3 text-[10px] font-bold text-blue-300 uppercase tracking-tighter">HAProxy + Keepalived</div>
                            </div>

                            <Icon name="arrow-right" className="text-white/10 hidden md:block" />

                            {/* Tier 3: Master Nodes */}
                            <div className="grid grid-cols-1 gap-3">
                                <div className="flex items-center gap-4 px-6 py-3 glass rounded-2xl border-purple-500/20">
                                    <Icon name="server" size={16} className="text-purple-400" />
                                    <span className="text-xs font-mono">Master-1 (10.0.0.1)</span>
                                    <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                                </div>
                                <div className="flex items-center gap-4 px-6 py-3 glass rounded-2xl border-purple-500/20">
                                    <Icon name="server" size={16} className="text-purple-400" />
                                    <span className="text-xs font-mono">Master-2 (10.0.0.2)</span>
                                    <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                                </div>
                                <div className="flex items-center gap-4 px-6 py-3 glass rounded-2xl border-purple-500/20">
                                    <Icon name="server" size={16} className="text-purple-400" />
                                    <span className="text-xs font-mono">Master-3 (10.0.0.3)</span>
                                    <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-3 gap-8 w-full max-w-2xl text-[10px] font-mono text-center text-white/30">
                            <div>1. Client connects to VIP</div>
                            <div>2. Keepalived routes to LB-1</div>
                            <div>3. HAProxy balances to Masters</div>
                        </div>
                    </div>
                )
            },
            {
                id: 'summary',
                title: 'Best Practices',
                subtitle: '實戰建議與總結',
                description: '在生產環境部署時的關鍵注意事項',
                gradient: 'gradient-slate',
                icon: 'award',
                content: (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="p-8 glass rounded-3xl border-white/5 space-y-4">
                            <h5 className="font-bold text-lg border-l-4 border-blue-500 pl-4">部署要點</h5>
                            <ul className="space-y-4 text-sm text-white/70">
                                <li className="flex gap-3"><Icon name="check" size={16} className="text-emerald-400" /> 使用專用的控制平面負載均衡器</li>
                                <li className="flex gap-3"><Icon name="check" size={16} className="text-emerald-400" /> Keepalived 務必設定 Unicast 以維持網路乾淨</li>
                                <li className="flex gap-3"><Icon name="check" size={16} className="text-emerald-400" /> 啟用 nopreempt 模式，防止服務頻繁切換</li>
                                <li className="flex gap-3"><Icon name="check" size={16} className="text-emerald-400" /> 定期進行切換測試 (Chaos Testing)</li>
                            </ul>
                        </div>
                        <div className="flex flex-col justify-center items-center p-8 bg-blue-500/10 rounded-3xl border border-blue-500/20">
                            <Icon name="rocket" size={64} className="text-blue-400 mb-6" />
                            <h4 className="text-2xl font-bold mb-2">Ready for HA</h4>
                            <p className="text-sm text-white/60 text-center">透過 Keepalived & HAProxy，打造堅不可摧的 K8s 基礎設施。</p>
                            <div className="mt-8 flex gap-4">
                                <div className="px-4 py-2 glass rounded-full text-[10px] font-mono uppercase tracking-widest text-blue-300">Robust</div>
                                <div className="px-4 py-2 glass rounded-full text-[10px] font-mono uppercase tracking-widest text-emerald-300">Efficient</div>
                                <div className="px-4 py-2 glass rounded-full text-[10px] font-mono uppercase tracking-widest text-purple-300">Scalable</div>
                            </div>
                        </div>
                    </div>
                )
            }
        ];

        // --- Components ---
        const App = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            const [direction, setDirection] = useState(0);

            const nextSlide = useCallback(() => {
                if (currentSlide < slides.length - 1) {
                    setDirection(1);
                    setCurrentSlide(prev => prev + 1);
                }
            }, [currentSlide]);

            const prevSlide = useCallback(() => {
                if (currentSlide > 0) {
                    setDirection(-1);
                    setCurrentSlide(prev => prev - 1);
                }
            }, [currentSlide]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
                    if (e.key === 'ArrowLeft') prevSlide();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [nextSlide, prevSlide]);

            const slide = slides[currentSlide];

            return (
                <div className={`h-screen w-screen overflow-hidden relative transition-colors duration-1000 ${slide.gradient}`}>
                    {/* Background decoration */}
                    <div className="absolute inset-0 opacity-20 pointer-events-none">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-500 rounded-full blur-[120px]"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-500 rounded-full blur-[120px]"></div>
                    </div>

                    <div className="relative z-10 h-full flex flex-col p-12 max-w-7xl mx-auto">
                        {/* Header */}
                        <header className="flex justify-between items-center mb-10">
                            <div className="flex items-center gap-4">
                                <div className="p-3 glass rounded-2xl flex items-center justify-center">
                                    <Icon name={slide.icon} className="text-white" size={24} />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black tracking-tighter uppercase leading-none">{slide.title}</h1>
                                    <p className="text-[10px] text-white/50 font-mono mt-1 uppercase tracking-widest leading-none">{slide.subtitle}</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {slides.map((_, i) => (
                                    <div 
                                        key={i} 
                                        className={`h-1 rounded-full transition-all duration-300 ${i === currentSlide ? 'w-8 bg-white' : 'w-2 bg-white/20'}`}
                                    />
                                ))}
                            </div>
                        </header>

                        {/* Main Content */}
                        <main className="flex-1 relative overflow-hidden flex flex-col pt-4">
                            <AnimatePresence mode="wait" custom={direction}>
                                <motion.div
                                    key={currentSlide}
                                    custom={direction}
                                    initial={{ opacity: 0, x: direction * 50, scale: 0.98 }}
                                    animate={{ opacity: 1, x: 0, scale: 1 }}
                                    exit={{ opacity: 0, x: direction * -50, scale: 1.02 }}
                                    transition={{ duration: 0.4, ease: [0.16, 1, 0.3, 1] }}
                                    className="w-full h-full flex flex-col"
                                >
                                    <div className="mb-8 max-w-3xl">
                                        <motion.p 
                                            initial={{ opacity: 0, y: 10 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            transition={{ delay: 0.2 }}
                                            className="text-lg text-white/80 leading-relaxed font-light"
                                        >
                                            {slide.description}
                                        </motion.p>
                                    </div>
                                    <motion.div 
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: 0.3 }}
                                        className="flex-1 slide-content-container"
                                    >
                                        {slide.content}
                                    </motion.div>
                                </motion.div>
                            </AnimatePresence>
                        </main>

                        {/* Footer / Controls */}
                        <footer className="mt-8 flex justify-between items-center border-t border-white/10 pt-8">
                            <div className="text-[10px] font-mono text-white/20 uppercase tracking-[0.2em]">
                                Keepalived & HAProxy • K8s Load Balancing • Phase 0
                            </div>
                            <div className="flex gap-4">
                                <button 
                                    onClick={prevSlide}
                                    disabled={currentSlide === 0}
                                    className={`p-4 rounded-full glass transition-all ${currentSlide === 0 ? 'opacity-20' : 'hover:bg-white/10 active:scale-90'}`}
                                >
                                    <Icon name="chevron-left" />
                                </button>
                                <button 
                                    onClick={nextSlide}
                                    disabled={currentSlide === slides.length - 1}
                                    className={`p-4 rounded-full glass transition-all ${currentSlide === slides.length - 1 ? 'opacity-20' : 'hover:bg-white/10 active:scale-90'}`}
                                >
                                    <Icon name="chevron-right" />
                                </button>
                            </div>
                        </footer>
                    </div>

                    {/* Page Number Indicator */}
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-xs font-mono text-white/10">
                        {String(currentSlide + 1).padStart(2, '0')} / {String(slides.length).padStart(2, '0')}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
