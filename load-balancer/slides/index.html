<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepalived & HAProxy: The Complete Guide</title>
    <link rel="icon" type="image/svg+xml" href="/notebook/load-balancer/slides/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden;
            margin: 0;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gradient-blue { background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 50%, #000 100%); }
        .gradient-purple { background: linear-gradient(135deg, #4c1d95 0%, #2e1065 50%, #000 100%); }
        .gradient-emerald { background: linear-gradient(135deg, #064e3b 0%, #022c22 50%, #000 100%); }
        .gradient-slate { background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #000 100%); }
        .gradient-rose { background: linear-gradient(135deg, #881337 0%, #4c0519 50%, #000 100%); }

        ::-webkit-scrollbar { display: none; }

        .slide-content-container {
            max-height: 72vh;
            overflow-y: auto;
            scrollbar-width: none;
            padding-right: 10px;
        }
        
        .code-block {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #93c5fd;
            line-height: 1.6;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .config-grid {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 1.5rem;
            align-items: center;
        }
        
        .scenario-box {
            transition: all 0.3s ease;
        }
        .scenario-box:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef, useMemo } = React;
        const MotionLib = window.Motion || window.FramerMotion;
        const { motion, AnimatePresence } = MotionLib;

        // --- Icons Wrapper ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                const timer = setInterval(() => {
                    if (window.lucide && window.lucide.createIcons && iconRef.current) {
                        window.lucide.createIcons({
                            attrs: { class: className, 'stroke-width': 2, 'width': size, 'height': size },
                            nameAttr: 'data-lucide'
                        });
                        clearInterval(timer);
                    }
                }, 100);
                return () => clearInterval(timer);
            }, [name, size, className]);
            return (
                <div className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}>
                    <i ref={iconRef} data-lucide={name} style={{ width: size, height: size }}></i>
                </div>
            );
        };

        // --- Animated Components ---
        const VRRPAnimationFull = () => {
            const [isLB1Alive, setIsLB1Alive] = useState(true);
            const [showPacket, setShowPacket] = useState(false);
            const [showGARP, setShowGARP] = useState(false);

            useEffect(() => {
                const packetInterval = setInterval(() => {
                    setShowPacket(true);
                    setTimeout(() => setShowPacket(false), 1200);
                }, 2500);
                return () => clearInterval(packetInterval);
            }, [isLB1Alive]);

            useEffect(() => {
                setShowGARP(true);
                const timer = setTimeout(() => setShowGARP(false), 1500);
                return () => clearTimeout(timer);
            }, [isLB1Alive]);

            return (
                <div className="flex flex-col items-center w-full space-y-12 py-4">
                    <div className="p-4 glass rounded-3xl border-blue-500/30 flex flex-col items-center w-48 relative">
                        <Icon name="network" size={40} className="text-blue-400" />
                        <span className="text-[10px] font-black mt-2 text-white/50 tracking-widest uppercase text-center leading-none">Core Switch<br/><span className="opacity-40">(L2 Layer)</span></span>
                        <AnimatePresence>
                            {showGARP && (
                                <motion.div initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1.2, opacity: 1 }} exit={{ scale: 1.5, opacity: 0 }} className="absolute -top-4 bg-emerald-500 border border-emerald-400 px-3 py-1 rounded-full text-[8px] text-black font-black shadow-xl">CAM TABLE REFRESHED</motion.div>
                            )}
                        </AnimatePresence>
                    </div>

                    <div className="flex justify-between items-center w-full max-w-4xl relative px-12">
                        {/* LB-1 */}
                        <div className="flex flex-col items-center z-10">
                            <motion.div animate={{ scale: isLB1Alive ? [1, 1.03, 1] : 1, opacity: isLB1Alive ? 1 : 0.4 }} transition={{ repeat: Infinity, duration: 2 }} className={`w-40 h-40 rounded-3xl flex flex-col items-center justify-center border-2 transition-colors relative ${isLB1Alive ? 'border-emerald-500 bg-emerald-500/10' : 'border-red-500 bg-red-500/10'}`}>
                                {isLB1Alive && <div className="absolute -top-3 bg-emerald-500 text-[9px] font-black px-3 py-1 rounded-full text-black shadow-lg">VIP 192.168.50.250</div>}
                                <Icon name={isLB1Alive ? "shield-check" : "shield-alert"} size={56} className={isLB1Alive ? "text-emerald-400" : "text-red-400"} />
                                <span className="text-xs font-black mt-3 font-mono">LB-NODE-01</span>
                                <span className="text-[9px] font-mono text-white/40">Pri: 100 (Master)</span>
                            </motion.div>
                        </div>

                        {/* GARP Visual */}
                        <AnimatePresence>
                            {showGARP && (
                                <motion.div initial={{ y: 60, x: isLB1Alive ? -200 : 200, opacity: 0 }} animate={{ y: -140, x: 0, opacity: 1 }} transition={{ duration: 0.8, ease: "circOut" }} className="absolute left-1/2 top-12 z-20">
                                    <div className="px-3 py-1 bg-emerald-400 rounded-full text-[9px] font-black text-black shadow-2xl uppercase tracking-tighter">Gratuitous ARP</div>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        {/* VRRP Visual */}
                        <AnimatePresence>
                            {showPacket && (
                                <motion.div initial={{ x: isLB1Alive ? 0 : 360, opacity: 0 }} animate={{ x: isLB1Alive ? 360 : 0, opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: 1.2, ease: "easeInOut" }} className="absolute left-[180px] top-16 z-0">
                                    <div className="flex flex-col items-center">
                                        <div className="px-3 py-1 bg-blue-500/90 rounded-full text-[8px] font-bold text-white shadow-lg whitespace-nowrap border border-blue-400/30">VRRP ADVERT (Pri: {isLB1Alive ? '100' : '50'})</div>
                                        <div className={`w-3 h-3 rounded-full mt-1 animate-ping ${isLB1Alive ? 'bg-blue-400' : 'bg-emerald-400'}`}></div>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        {/* LB-2 */}
                        <div className="flex flex-col items-center z-10">
                            <motion.div animate={{ borderColor: !isLB1Alive ? "#10b981" : "rgba(255,255,255,0.1)", backgroundColor: !isLB1Alive ? "rgba(16,185,129,0.1)" : "rgba(255,255,255,0.03)", scale: !isLB1Alive ? [1, 1.03, 1] : 1 }} transition={!isLB1Alive ? { repeat: Infinity, duration: 2 } : {}} className="w-40 h-40 rounded-3xl flex flex-col items-center justify-center border-2 glass relative">
                                {!isLB1Alive && <div className="absolute -top-3 bg-emerald-500 text-[9px] font-black px-3 py-1 rounded-full text-black shadow-lg">VIP 192.168.50.250</div>}
                                <Icon name={!isLB1Alive ? "shield-check" : "clock"} size={56} className={!isLB1Alive ? "text-emerald-400" : "text-white/20"} />
                                <span className="text-xs font-black mt-3 font-mono uppercase">LB-NODE-02</span>
                                <span className="text-[9px] font-mono text-white/40">Pri: 50 (Backup)</span>
                            </motion.div>
                        </div>
                    </div>

                    <div className="flex gap-6">
                        <button onClick={() => setIsLB1Alive(!isLB1Alive)} className={`px-10 py-4 rounded-full font-black text-xs uppercase tracking-widest transition-all shadow-2xl ${isLB1Alive ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-900/40' : 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-900/40'}`}>
                            {isLB1Alive ? "Trigger Failure (LB-01 Down)" : "Recover LB-01"}
                        </button>
                    </div>
                </div>
            );
        };

        const HAProxyCrashSimulation = () => {
            const [nodes, setNodes] = useState([
                { id: 1, ip: '10.0.0.1', status: 'healthy' },
                { id: 2, ip: '10.0.0.2', status: 'healthy' },
                { id: 3, ip: '10.0.0.3', status: 'healthy' },
            ]);
            const toggleNode = (id) => {
                setNodes(nodes.map(n => n.id === id ? { ...n, status: n.status === 'healthy' ? 'crashed' : 'healthy' } : n));
            };
            return (
                <div className="flex flex-col items-center space-y-10 w-full py-6">
                    <div className="w-full max-w-2xl bg-black/60 rounded-3xl p-6 border border-white/10 shadow-2xl">
                        <div className="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
                            <h5 className="font-mono text-xs text-blue-400 font-bold uppercase tracking-widest">HAProxy Statistics UI</h5>
                            <div className="flex gap-4">
                                <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-emerald-500"></div><span className="text-[10px]">UP</span></div>
                                <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-red-500"></div><span className="text-[10px]">DOWN</span></div>
                            </div>
                        </div>
                        <div className="space-y-4">
                            {nodes.map(n => (
                                <motion.div key={n.id} animate={{ backgroundColor: n.status === 'healthy' ? 'rgba(16,185,129,0.05)' : 'rgba(244,63,94,0.1)' }} className="flex items-center justify-between p-4 rounded-xl border border-white/5">
                                    <div className="flex items-center gap-4">
                                        <div className={`p-2 rounded-lg ${n.status === 'healthy' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>
                                            <Icon name="server" size={20} />
                                        </div>
                                        <div><div className="text-xs font-bold text-white/80">API-SERVER-{n.id}</div><div className="text-[10px] font-mono text-white/30">{n.ip}</div></div>
                                    </div>
                                    <div className="flex items-center gap-8">
                                        <div className="text-right"><div className="text-[10px] text-white/30 uppercase">Status</div><div className={`text-[10px] font-black ${n.status === 'healthy' ? 'text-emerald-400' : 'text-red-400'}`}>{n.status.toUpperCase()}</div></div>
                                        <button onClick={() => toggleNode(n.id)} className="px-3 py-1 bg-white/5 hover:bg-white/10 rounded-lg text-[9px] font-bold transition-all border border-white/10 uppercase tracking-tighter">Toggle Crash</button>
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                    <div className="p-6 glass rounded-2xl border-blue-500/10 max-w-xl text-center">
                        <p className="text-sm text-white/70 italic leading-relaxed font-light">"當後端 Service 發生故障時，HAProxy 的健康檢查機制 (check) 會在定義的間隔內自動將節點剔除，保證流量不被轉發至無效節點。"</p>
                    </div>
                </div>
            );
        };

        // --- Data Definitions ---
        const slides = [
            { id: 'hero', title: 'High Availability Masters', subtitle: 'HAProxy & Keepalived Deep Dive', description: '打造電信級 K8s 控制平面高可用架構：從負載均衡到故障自動恢復', gradient: 'gradient-blue', icon: 'shield-check', content: (
                <div className="flex flex-col items-center justify-center text-center space-y-12 py-10">
                    <div className="flex gap-10">
                        <div className="flex flex-col items-center"><div className="w-16 h-16 glass rounded-2xl flex items-center justify-center mb-3 text-emerald-400"><Icon name="cpu" size={32}/></div><span className="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">HAProxy</span></div>
                        <div className="flex flex-col items-center"><div className="w-16 h-16 glass rounded-2xl flex items-center justify-center mb-3 text-blue-400"><Icon name="activity" size={32}/></div><span className="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">Keepalived</span></div>
                        <div className="flex flex-col items-center"><div className="w-16 h-16 glass rounded-2xl flex items-center justify-center mb-3 text-purple-400"><Icon name="box" size={32}/></div><span className="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">K8s API</span></div>
                    </div>
                    <div className="grid grid-cols-2 gap-8 w-full max-w-3xl">
                        <div className="p-8 glass rounded-[40px] text-left border-l-4 border-l-blue-500"><h4 className="font-black text-xl mb-2 text-blue-400">L4 Load Balancing</h4><p className="text-xs text-white/50 leading-relaxed">高性能 TCP 轉發，解決 API Server 水平擴展難題。</p></div>
                        <div className="p-8 glass rounded-[40px] text-left border-l-4 border-l-emerald-500"><h4 className="font-black text-xl mb-2 text-emerald-400">VRRP Redundancy</h4><p className="text-xs text-white/50 leading-relaxed">消除負載均衡器自身單點故障，實現 VIP 秒級漂移。</p></div>
                    </div>
                </div>
            )},
            { id: 'haproxy-intro', title: 'HAProxy Fundamentals', subtitle: 'The Load Balancing Core', description: '高性能負載均衡的代名詞，支援數百萬級並發連線的強大引擎。', gradient: 'gradient-slate', icon: 'zap', content: (
                <div className="grid grid-cols-2 gap-10 h-full">
                    <div className="space-y-8">
                        <div className="scenario-box p-6 glass rounded-3xl border-white/5"><h5 className="font-bold text-lg flex items-center gap-3 text-blue-400"><Icon name="layers" size={20}/> Layer 4 (TCP) Mode</h5><p className="text-xs text-white/60 leading-relaxed mt-2">針對 K8s 6443 Port，不解密 SSL 封包直接透傳，效能最高、資源消耗最低。</p></div>
                        <div className="scenario-box p-6 glass rounded-3xl border-white/5"><h5 className="font-bold text-lg flex items-center gap-3 text-purple-400"><Icon name="globe" size={20}/> Layer 7 (HTTP) Mode</h5><p className="text-xs text-white/60 leading-relaxed mt-2">支援 SSL 卸載、內容過濾、Header 改寫，適用於 Ingress Controller 情境。</p></div>
                    </div>
                    <div className="p-8 glass rounded-3xl bg-blue-500/5 flex flex-col justify-center border-blue-500/10"><h5 className="text-center font-black text-2xl mb-6">Why HAProxy?</h5><div className="space-y-4 text-sm text-white/80"><div className="flex gap-4 items-center"><Icon name="check-circle" className="text-emerald-400" size={16}/> 極低延遲 (Event-driven)</div><div className="flex gap-4 items-center"><Icon name="check-circle" className="text-emerald-400" size={16}/> 強大的健康檢查 (Health Checks)</div><div className="flex gap-4 items-center"><Icon name="check-circle" className="text-emerald-400" size={16}/> 靈活的調度算法</div></div></div>
                </div>
            )},
            { id: 'haproxy-frontend', title: 'Frontend Deep Dive', subtitle: 'Entry Point Logic', description: '定義流量「如何進入」負載均衡器，包含監聽端口、SSL 憑證與過濾規則。', gradient: 'gradient-blue', icon: 'indent', content: (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="code-block h-fit"><div className="text-white/30 text-[9px] mb-2 uppercase">/etc/haproxy/haproxy.cfg</div>
{`frontend k8s-api
    bind *:6443
    mode tcp
    option tcplog
    default_backend k8s-masters

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s`}
                    </div>
                    <div className="space-y-6">
                        <div className="config-grid border-b border-white/5 pb-4"><span className="text-blue-400 font-bold text-sm">bind</span><span className="text-xs text-white/60 leading-relaxed">監聽實體位址或 VIP。* 表示監聽所有網卡。</span></div>
                        <div className="config-grid border-b border-white/5 pb-4"><span className="text-blue-400 font-bold text-sm">mode tcp</span><span className="text-xs text-white/60 leading-relaxed">針對 API Server 必須使用 TCP 模式進行透傳。</span></div>
                        <div className="config-grid border-b border-white/5 pb-4"><span className="text-blue-400 font-bold text-sm">stats enable</span><span className="text-xs text-white/60 leading-relaxed">開啟監控網頁，視覺化檢視各後端節點健康度。</span></div>
                    </div>
                </div>
            )},
            { id: 'haproxy-backend', title: 'Backend Logic', subtitle: 'Target Distribution', description: '定義流量「送往何處」，並設定負載分配策略與健康檢查標準。', gradient: 'gradient-slate', icon: 'outdent', content: (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="code-block h-fit"><div className="text-white/30 text-[9px] mb-2 uppercase">/etc/haproxy/haproxy.cfg</div>
{`backend k8s-masters
    mode tcp
    balance roundrobin
    option tcp-check
    server master1 10.0.0.1:6443 check inter 2s rise 2 fall 3
    server master2 10.0.0.2:6443 check inter 2s rise 2 fall 3
    server master3 10.0.0.3:6443 check inter 2s rise 2 fall 3`}
                    </div>
                    <div className="space-y-4">
                        <div className="p-5 glass rounded-2xl border-l-2 border-emerald-500"><h6 className="font-bold text-sm text-emerald-400 mb-1">Check Parameters</h6><p className="text-[11px] text-white/50">inter: 檢查頻率 (2s) <br/> rise: 成功 2 次判定為恢復 <br/> fall: 失敗 3 次判定為故障</p></div>
                        <div className="p-5 glass rounded-2xl border-l-2 border-blue-500"><h6 className="font-bold text-sm text-blue-400 mb-1">Balance Algorithms</h6><p className="text-[11px] text-white/50">roundrobin: 輪詢分配 <br/> leastconn: 最少連線優先 (推薦用於長連線)</p></div>
                    </div>
                </div>
            )},
            { id: 'haproxy-crash', title: 'Scenario: Backend Crash', subtitle: 'Automatic Fail-Isolation', description: '模擬當其中一台 API Server 發生故障時，HAProxy 如何保護控制平面。', gradient: 'gradient-rose', icon: 'alert-triangle', content: <HAProxyCrashSimulation /> },
            { id: 'haproxy-stats', title: 'Monitoring & Stats', subtitle: 'Visibility is Control', description: 'HAProxy 內建強大的統計報表，可用於監控流量、錯誤率與反應時間。', gradient: 'gradient-slate', icon: 'bar-chart-3', content: (
                <div className="flex flex-col items-center py-10">
                    <div className="grid grid-cols-4 gap-6 w-full max-w-4xl">
                        <div className="p-6 glass rounded-3xl text-center"><div className="text-2xl font-black text-blue-400">1.2M</div><div className="text-[10px] text-white/40 uppercase mt-2">Sessions/s</div></div>
                        <div className="p-6 glass rounded-3xl text-center border-emerald-500/20"><div className="text-2xl font-black text-emerald-400">100%</div><div className="text-[10px] text-white/40 uppercase mt-2">Uptime</div></div>
                        <div className="p-6 glass rounded-3xl text-center"><div className="text-2xl font-black text-purple-400">15ms</div><div className="text-[10px] text-white/40 uppercase mt-2">Avg Latency</div></div>
                        <div className="p-6 glass rounded-3xl text-center border-red-500/20"><div className="text-2xl font-black text-red-400">0.01%</div><div className="text-[10px] text-white/40 uppercase mt-2">Error Rate</div></div>
                    </div>
                    <div className="mt-12 p-8 glass rounded-[40px] w-full border-white/5 relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="activity" size={80}/></div>
                        <h5 className="font-bold text-xl mb-4">Real-time Decision Making</h5>
                        <p className="text-sm text-white/60 leading-relaxed max-w-2xl">透過 Prometheus Exporter，統計數據可以輕鬆整合至 Grafana 儀表板，提供秒級的系統洞察與告警觸發。</p>
                    </div>
                </div>
            )},
            { id: 'keepalived-vrrp-full', title: 'VRRP Mechanism', subtitle: 'Failover in Action', description: '深入理解 VRRP Advertisement 與 Gratuitous ARP (GARP) 的協同運作。', gradient: 'gradient-purple', icon: 'activity', content: <VRRPAnimationFull /> },
            { id: 'keepalived-vrrp-theory', title: 'VRRP Protocol Theory', subtitle: 'The Heart of Redundancy', description: 'VRRP (Virtual Router Redundancy Protocol) 是其實現 VIP 高可用的核心協定。', gradient: 'gradient-slate', icon: 'info', content: (
                <div className="grid grid-cols-3 gap-6 py-6 h-full">
                    <div className="p-6 glass rounded-3xl flex flex-col justify-between"><h6 className="text-blue-400 font-bold mb-3 uppercase tracking-tighter">Multicast/Unicast</h6><p className="text-xs text-white/60">預設使用組播 (224.0.0.18)，但在嚴格的網路環境中改用單播 (Unicast) 更為安全且可控。</p><Icon name="radio" size={32} className="text-white/10 mt-4 self-end"/></div>
                    <div className="p-6 glass rounded-3xl flex flex-col justify-between"><h6 className="text-emerald-400 font-bold mb-3 uppercase tracking-tighter">Priority Election</h6><p className="text-xs text-white/60">數值較高者 (100 vs 50) 獲勝成為 Master。若數值相同，則 IP 較大者獲勝。</p><Icon name="award" size={32} className="text-white/10 mt-4 self-end"/></div>

                        <main className="flex-1 relative overflow-hidden flex flex-col pt-2">
                            <AnimatePresence mode="wait" custom={direction}>
                                <motion.div key={currentSlide} custom={direction} initial={{ opacity: 0, x: direction * 80, scale: 0.98, filter: 'blur(10px)' }} animate={{ opacity: 1, x: 0, scale: 1, filter: 'blur(0px)' }} exit={{ opacity: 0, x: direction * -80, scale: 1.02, filter: 'blur(10px)' }} transition={{ duration: 0.5, ease: [0.16, 1, 0.3, 1] }} className="w-full h-full flex flex-col">
                                    <div className="mb-8 max-w-4xl">
                                        <motion.p initial={{ opacity: 0, y: 15 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.2 }} className="text-xl text-white/80 leading-relaxed font-light tracking-tight italic">"{slide.description}"</motion.p>
                                    </div>
                                    <motion.div initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.35 }} className="flex-1 slide-content-container">
                                        {slide.content}
                                    </motion.div>
                                </motion.div>
                            </AnimatePresence>
                        </main>

                        <footer className="mt-8 flex justify-between items-center border-t border-white/5 pt-8">
                            <div className="text-[10px] font-black font-mono text-white/20 uppercase tracking-[0.4em]">Keepalived & HAProxy • Advanced HA Stack • 2026</div>
                            <div className="flex gap-5">
                                <button onClick={prevSlide} disabled={currentSlide === 0} className={`p-5 rounded-full glass transition-all border-white/10 ${currentSlide === 0 ? 'opacity-10' : 'hover:bg-white/10 hover:scale-110 active:scale-95 shadow-xl'}`}><Icon name="chevron-left" size={24}/></button>
                                <button onClick={nextSlide} disabled={currentSlide === slides.length - 1} className={`p-5 rounded-full glass transition-all border-white/10 ${currentSlide === slides.length - 1 ? 'opacity-10' : 'hover:bg-white/10 hover:scale-110 active:scale-95 shadow-xl'}`}><Icon name="chevron-right" size={24}/></button>
                            </div>
                        </footer>
                    </div>
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-xs font-black font-mono text-white/10 tracking-widest">{String(currentSlide + 1).padStart(2, '0')} / {String(slides.length).padStart(2, '0')}</div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
