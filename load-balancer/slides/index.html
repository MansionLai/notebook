<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepalived & HAProxy: The Complete Guide</title>
    <link rel="icon" type="image/svg+xml" href="/notebook/load-balancer/slides/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden;
            margin: 0;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gradient-blue { background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 50%, #000 100%); }
        .gradient-purple { background: linear-gradient(135deg, #4c1d95 0%, #2e1065 50%, #000 100%); }
        .gradient-emerald { background: linear-gradient(135deg, #064e3b 0%, #022c22 50%, #000 100%); }
        .gradient-slate { background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #000 100%); }
        .gradient-rose { background: linear-gradient(135deg, #881337 0%, #4c0519 50%, #000 100%); }

        ::-webkit-scrollbar { display: none; }

        .slide-content-container {
            max-height: 72vh;
            overflow-y: auto;
            scrollbar-width: none;
            padding-right: 10px;
        }
        
        .code-block {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #93c5fd;
            line-height: 1.6;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .config-grid {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 1.5rem;
            align-items: center;
        }
        
        .scenario-box {
            transition: all 0.3s ease;
        }
        .scenario-box:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef, useMemo } = React;
        const MotionLib = window.Motion || window.FramerMotion;
        const { motion, AnimatePresence } = MotionLib;

        // --- Icons Wrapper ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                const timer = setInterval(() => {
                    if (window.lucide && window.lucide.createIcons && iconRef.current) {
                        window.lucide.createIcons({
                            attrs: { class: className, 'stroke-width': 2, 'width': size, 'height': size },
                            nameAttr: 'data-lucide'
                        });
                        clearInterval(timer);
                    }
                }, 100);
                return () => clearInterval(timer);
            }, [name, size, className]);
            return (
                <div className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}>
                    <i ref={iconRef} data-lucide={name} style={{ width: size, height: size }}></i>
                </div>
            );
        };

        // --- Animated Components ---
        const VRRPAnimationFull = () => {
            const [isLB1Alive, setIsLB1Alive] = useState(true);
            const [showPacket, setShowPacket] = useState(false);
            const [showGARP, setShowGARP] = useState(false);

            useEffect(() => {
                const packetInterval = setInterval(() => {
                    setShowPacket(true);
                    setTimeout(() => setShowPacket(false), 1200);
                }, 2500);
                return () => clearInterval(packetInterval);
            }, [isLB1Alive]);

            useEffect(() => {
                setShowGARP(true);
                const timer = setTimeout(() => setShowGARP(false), 1500);
                return () => clearTimeout(timer);
            }, [isLB1Alive]);

            return (
                <div className="flex flex-col items-center w-full space-y-12 py-4">
                    <div className="p-4 glass rounded-3xl border-blue-500/30 flex flex-col items-center w-48 relative">
                        <Icon name="network" size={40} className="text-blue-400" />
                        <span className="text-[10px] font-black mt-2 text-white/50 tracking-widest uppercase text-center leading-none">Core Switch<br/><span className="opacity-40">(L2 Layer)</span></span>
                        <AnimatePresence>
                            {showGARP && (
                                <motion.div initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1.2, opacity: 1 }} exit={{ scale: 1.5, opacity: 0 }} className="absolute -top-4 bg-emerald-500 border border-emerald-400 px-3 py-1 rounded-full text-[8px] text-black font-black shadow-xl">CAM TABLE REFRESHED</motion.div>
                            )}
                        </AnimatePresence>
                    </div>

                    <div className="flex justify-between items-center w-full max-w-4xl relative px-12">
                        {/* LB-1 */}
                        <div className="flex flex-col items-center z-10">
                            <motion.div animate={{ scale: isLB1Alive ? [1, 1.03, 1] : 1, opacity: isLB1Alive ? 1 : 0.4 }} transition={{ repeat: Infinity, duration: 2 }} className={`w-40 h-40 rounded-3xl flex flex-col items-center justify-center border-2 transition-colors relative ${isLB1Alive ? 'border-emerald-500 bg-emerald-500/10' : 'border-red-500 bg-red-500/10'}`}>
                                {isLB1Alive && <div className="absolute -top-3 bg-emerald-500 text-[9px] font-black px-3 py-1 rounded-full text-black shadow-lg">VIP 192.168.50.250</div>}
                                <Icon name={isLB1Alive ? "shield-check" : "shield-alert"} size={56} className={isLB1Alive ? "text-emerald-400" : "text-red-400"} />
                                <span className="text-xs font-black mt-3 font-mono">LB-NODE-01</span>
                                <span className="text-[9px] font-mono text-white/40">Pri: 100 (Master)</span>
                            </motion.div>
                        </div>

                        {/* GARP Visual */}
                        <AnimatePresence>
                            {showGARP && (
                                <motion.div initial={{ y: 60, x: isLB1Alive ? -200 : 200, opacity: 0 }} animate={{ y: -140, x: 0, opacity: 1 }} transition={{ duration: 0.8, ease: "circOut" }} className="absolute left-1/2 top-12 z-20">
                                    <div className="px-3 py-1 bg-emerald-400 rounded-full text-[9px] font-black text-black shadow-2xl uppercase tracking-tighter">Gratuitous ARP</div>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        {/* VRRP Visual */}
                        <AnimatePresence>
                            {showPacket && (
                                <motion.div initial={{ x: isLB1Alive ? 0 : 360, opacity: 0 }} animate={{ x: isLB1Alive ? 360 : 0, opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: 1.2, ease: "easeInOut" }} className="absolute left-[180px] top-16 z-0">
                                    <div className="flex flex-col items-center">
                                        <div className="px-3 py-1 bg-blue-500/90 rounded-full text-[8px] font-bold text-white shadow-lg whitespace-nowrap border border-blue-400/30">VRRP ADVERT (Pri: {isLB1Alive ? '100' : '50'})</div>
                                        <div className={`w-3 h-3 rounded-full mt-1 animate-ping ${isLB1Alive ? 'bg-blue-400' : 'bg-emerald-400'}`}></div>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        {/* LB-2 */}
                        <div className="flex flex-col items-center z-10">
                            <motion.div animate={{ borderColor: !isLB1Alive ? "#10b981" : "rgba(255,255,255,0.1)", backgroundColor: !isLB1Alive ? "rgba(16,185,129,0.1)" : "rgba(255,255,255,0.03)", scale: !isLB1Alive ? [1, 1.03, 1] : 1 }} transition={!isLB1Alive ? { repeat: Infinity, duration: 2 } : {}} className="w-40 h-40 rounded-3xl flex flex-col items-center justify-center border-2 glass relative">
                                {!isLB1Alive && <div className="absolute -top-3 bg-emerald-500 text-[9px] font-black px-3 py-1 rounded-full text-black shadow-lg">VIP 192.168.50.250</div>}
                                <Icon name={!isLB1Alive ? "shield-check" : "clock"} size={56} className={!isLB1Alive ? "text-emerald-400" : "text-white/20"} />
                                <span className="text-xs font-black mt-3 font-mono uppercase">LB-NODE-02</span>
                                <span className="text-[9px] font-mono text-white/40">Pri: 50 (Backup)</span>
                            </motion.div>
                        </div>
                    </div>

                    <div className="flex gap-6">
                        <button onClick={() => setIsLB1Alive(!isLB1Alive)} className={`px-10 py-4 rounded-full font-black text-xs uppercase tracking-widest transition-all shadow-2xl ${isLB1Alive ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-900/40' : 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-900/40'}`}>
                            {isLB1Alive ? "Trigger Failure (LB-01 Down)" : "Recover LB-01"}
                        </button>
                    </div>
                </div>
            );
        };

        const HAProxyCrashSimulation = () => {
            const [nodes, setNodes] = useState([
                { id: 1, ip: '10.0.0.1', status: 'healthy', active: true },
                { id: 2, ip: '10.0.0.2', status: 'healthy', active: true },
                { id: 3, ip: '10.0.0.3', status: 'healthy', active: true },
            ]);
            const toggleNode = (id) => {
                setNodes(nodes.map(n => n.id === id ? { ...n, status: n.status === 'healthy' ? 'crashed' : 'healthy', active: n.status === 'crashed' } : n));
            };
            return (
                <div className="flex flex-col items-center space-y-10 w-full py-6">
                    <div className="w-full max-w-3xl bg-black/60 rounded-3xl p-6 border border-white/10 shadow-2xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 blur-3xl"></div>
                        <div className="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
                            <h5 className="font-mono text-xs text-blue-400 font-bold uppercase tracking-widest">HAProxy Backend Health Monitor</h5>
                            <div className="flex gap-4">
                                <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-emerald-500"></div><span className="text-[10px] text-white/50 font-bold tracking-widest uppercase">Active</span></div>
                                <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-red-500"></div><span className="text-[10px] text-white/50 font-bold tracking-widest uppercase">Excluded</span></div>
                            </div>
                        </div>
                        <div className="space-y-4">
                            {nodes.map(n => (
                                <motion.div key={n.id} animate={{ x: n.status === 'crashed' ? 20 : 0, opacity: n.status === 'crashed' ? 0.6 : 1 }} className={`flex items-center justify-between p-4 rounded-xl border transition-all ${n.status === 'healthy' ? 'bg-emerald-500/5 border-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.05)]' : 'bg-red-500/10 border-red-500/30'}`}>
                                    <div className="flex items-center gap-4">
                                        <div className={`p-3 rounded-xl transition-colors ${n.status === 'healthy' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>
                                            <Icon name={n.status === 'healthy' ? "server" : "server-off"} size={24} />
                                        </div>
                                        <div>
                                            <div className="text-sm font-black text-white/90">API-SERVER-{n.id}</div>
                                            <div className="text-[10px] font-mono text-white/30">{n.ip}:6443</div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-12">
                                        <div className="text-right">
                                            <div className="text-[9px] text-white/30 uppercase font-black tracking-widest mb-1">HAProxy Action</div>
                                            <div className={`px-3 py-0.5 rounded-full text-[9px] font-black inline-block uppercase tracking-tighter ${n.status === 'healthy' ? 'bg-emerald-500 text-black' : 'bg-red-500 text-white'}`}>
                                                {n.status === 'healthy' ? "Forwarding Traffic" : "Traffic Dropped"}
                                            </div>
                                        </div>
                                        <button onClick={() => toggleNode(n.id)} className={`px-4 py-2 rounded-xl text-[10px] font-black transition-all border uppercase tracking-widest ${n.status === 'healthy' ? 'bg-white/5 hover:bg-red-500/20 border-white/10 hover:border-red-500/50' : 'bg-emerald-500/20 hover:bg-emerald-500/40 border-emerald-500/50'}`}>
                                            {n.status === 'healthy' ? "Simulate Crash" : "Fix Node"}
                                        </button>
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                    <div className="p-8 glass rounded-3xl border-emerald-500/20 max-w-2xl text-center">
                        <p className="text-sm text-white/80 font-light leading-relaxed">
                            <span className="text-emerald-400 font-black uppercase tracking-widest">核心價值：</span> 當後端服務故障（如進程崩潰或網路中斷）時，HAProxy 的 <code className="bg-black/40 px-1.5 py-0.5 rounded text-blue-300">check</code> 指令會立刻發現異常，並在秒級內將該節點從分配名單中移除，確保客戶端 <code className="text-white font-mono">kubectl</code> 請求永不落空。
                        </p>
                    </div>
                </div>
            );
        };

        // --- Data Definitions ---
        const slides = [
            { id: 'hero', title: 'High Availability Masters', subtitle: 'HAProxy & Keepalived Deep Dive', description: '打造電信級 K8s 控制平面高可用架構：從負載均衡到故障自動恢復', gradient: 'gradient-blue', icon: 'shield-check', content: (
                <div className="flex flex-col items-center justify-center text-center space-y-12 py-10">
                    <div className="flex gap-10">
                        <div className="flex flex-col items-center"><div className="w-16 h-16 glass rounded-2xl flex items-center justify-center mb-3 text-emerald-400 border border-emerald-400/20"><Icon name="cpu" size={32}/></div><span className="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">HAProxy</span></div>
                        <div className="flex flex-col items-center"><div className="w-16 h-16 glass rounded-2xl flex items-center justify-center mb-3 text-blue-400 border border-blue-400/20"><Icon name="activity" size={32}/></div><span className="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">Keepalived</span></div>
                        <div className="flex flex-col items-center"><div className="w-16 h-16 glass rounded-2xl flex items-center justify-center mb-3 text-purple-400 border border-purple-400/20"><Icon name="box" size={32}/></div><span className="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">K8s API</span></div>
                    </div>
                    <div className="grid grid-cols-2 gap-8 w-full max-w-3xl">
                        <div className="p-8 glass rounded-[40px] text-left border-l-4 border-l-emerald-500 shadow-[0_20px_50px_rgba(16,185,129,0.1)]">
                            <h4 className="font-black text-xl mb-2 text-emerald-400 uppercase tracking-tighter">L4 Load Balancing (HAProxy)</h4>
                            <p className="text-xs text-white/50 leading-relaxed font-light">高效能的流量轉發中樞，將大量的 K8s API 請求均勻分配至後端多台 Master 節點。</p>
                        </div>
                        <div className="p-8 glass rounded-[40px] text-left border-l-4 border-l-blue-500 shadow-[0_20px_50px_rgba(59,130,246,0.1)]">
                            <h4 className="font-black text-xl mb-2 text-blue-400 uppercase tracking-tighter">VRRP Redundancy (Keepalived)</h4>
                            <p className="text-xs text-white/50 leading-relaxed font-light">提供「負載均衡器本身」的高可用。透過 VRRP 協定建立主備冗餘，確保 VIP 永不離線。</p>
                        </div>
                    </div>
                </div>
            )},
            { id: 'haproxy-modes', title: 'HAProxy Operation Modes', subtitle: 'L4 vs L7 Comparison', description: '針對不同層級的流量進行優化，HAProxy 提供 TCP 與 HTTP 兩種截然不同的運作模式。', gradient: 'gradient-slate', icon: 'zap', content: (
                <div className="grid grid-cols-2 gap-10 py-4">
                    <div className="scenario-box p-8 glass rounded-[40px] border-emerald-500/10 relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="cpu" size={60}/></div>
                        <h5 className="font-black text-xl text-emerald-400 mb-4 tracking-tighter uppercase">Layer 4 (TCP Mode)</h5>
                        <ul className="space-y-4 text-xs text-white/70 font-light leading-relaxed">
                            <li className="flex gap-3"><Icon name="fast-forward" size={14} className="text-emerald-400 mt-0.5"/> <span className="font-bold text-white">運作原理：</span> 基於 IP 與 Port 轉發，不拆解應用層數據。</li>
                            <li className="flex gap-3"><Icon name="zap" size={14} className="text-emerald-400 mt-0.5"/> <span className="font-bold text-white">優點：</span> 極低延遲、極低 CPU 消耗、支援 TLS 透傳。</li>
                            <li className="flex gap-3"><Icon name="target" size={14} className="text-emerald-400 mt-0.5"/> <span className="font-bold text-white">適用情境：</span> <span className="bg-emerald-500/20 text-emerald-300 px-1 rounded">K8s API Server (6443)</span>、資料庫、Redis。</li>
                        </ul>
                    </div>
                    <div className="scenario-box p-8 glass rounded-[40px] border-purple-500/10 relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="globe" size={60}/></div>
                        <h5 className="font-black text-xl text-purple-400 mb-4 tracking-tighter uppercase">Layer 7 (HTTP Mode)</h5>
                        <ul className="space-y-4 text-xs text-white/70 font-light leading-relaxed">
                            <li className="flex gap-3"><Icon name="search" size={14} className="text-purple-400 mt-0.5"/> <span className="font-bold text-white">運作原理：</span> 解析 HTTP Header、URL、Cookie 等詳細資訊。</li>
                            <li className="flex gap-3"><Icon name="shield-check" size={14} className="text-purple-400 mt-0.5"/> <span className="font-bold text-white">優點：</span> 支援 SSL 卸載、路徑路由、更精準的 ACL 過濾。</li>
                            <li className="flex gap-3"><Icon name="layout" size={14} className="text-purple-400 mt-0.5"/> <span className="font-bold text-white">適用情境：</span> Ingress Controller、網頁 API、微服務路由。</li>
                        </ul>
                    </div>
                </div>
            )},
            { id: 'haproxy-frontend-logic', title: 'HAProxy: The Frontend', subtitle: 'Listening & Filtering', description: 'Frontend 定義了流量的入口邏輯。它是 HAProxy 的「感官」，決定如何接收連線。', gradient: 'gradient-blue', icon: 'indent', content: (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                    <div className="space-y-6">
                        <div className="p-6 glass rounded-3xl border-l-4 border-blue-500">
                            <h5 className="font-black text-lg text-blue-400 mb-2">Frontend 做什麼？</h5>
                            <p className="text-xs text-white/60 leading-relaxed font-light">
                                1. 監聽實體 IP 或 VIP 的特定 Port。<br/>
                                2. 定義連線限制 (maxconn)。<br/>
                                3. 執行 ACL 安全過濾 (如阻擋特定 IP)。<br/>
                                4. 指向特定的 Backend 進行流量轉發。
                            </p>
                        </div>
                        <div className="code-block">
{`frontend k8s-api
    bind *:6443      # 監聽入口
    mode tcp         # 採用 L4 模式
    option tcplog    # 啟用 TCP 詳細日誌
    default_backend k8s-masters`}
                        </div>
                    </div>
                    <div className="p-6 glass rounded-3xl border-white/5 space-y-4">
                        <Icon name="radio" size={40} className="text-blue-500 opacity-20" />
                        <h6 className="font-bold">Entry Point Strategy</h6>
                        <p className="text-[11px] text-white/40 leading-relaxed">
                            在 K8s HA 架構中，通常會建議將 <code className="text-blue-300">bind</code> 設定在 VIP 上，或是使用 <code className="text-blue-300">*</code> 監聽所有介面，確保不論 VIP 漂移到哪台 LB，HAProxy 都能即時接管。
                        </p>
                    </div>
                </div>
            )},
            { id: 'haproxy-backend-logic', title: 'HAProxy: The Backend', subtitle: 'Load Balancing & Health', description: 'Backend 定義了流量的去向。它是 HAProxy 的「大腦」，負責選擇最健康的伺服器。', gradient: 'gradient-slate', icon: 'outdent', content: (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                    <div className="space-y-6">
                        <div className="p-6 glass rounded-3xl border-l-4 border-emerald-500">
                            <h5 className="font-black text-lg text-emerald-400 mb-2">Backend 做什麼？</h5>
                            <p className="text-xs text-white/60 leading-relaxed font-light">
                                1. 維護後端伺服器列表 (Pool)。<br/>
                                2. 決定調度算法 (Round Robin/Leastconn)。<br/>
                                3. 持續發送健康檢查偵測節點。<br/>
                                4. 在故障發生時執行節點剔除與恢復。
                            </p>
                        </div>
                        <div className="code-block">
{`backend k8s-masters
    mode tcp
    balance roundrobin   # 輪詢調度
    option tcp-check     # TCP 健康檢查
    server m1 10.0.0.1:6443 check inter 2s
    server m2 10.0.0.2:6443 check inter 2s`}
                        </div>
                    </div>
                    <div className="p-6 glass rounded-3xl border-white/5 space-y-4">
                        <Icon name="cpu" size={40} className="text-emerald-500 opacity-20" />
                        <h6 className="font-bold">Service Intelligence</h6>
                        <p className="text-[11px] text-white/40 leading-relaxed">
                            HAProxy 會在背景不斷測試 <code className="text-emerald-300">server</code> 設定中的位址。只要回應超時或拒絕連線，該伺服器就會從運算清單中「暫時移除」，直到它重新通過健康檢查。
                        </p>
                    </div>
                </div>

            { id: 'haproxy-crash-v2', title: 'Scenario: Backend Crash', subtitle: 'Self-Healing in Action', description: '直觀了解 HAProxy 如何在偵測到後端服務失效時，實現自動化的流量隔離。', gradient: 'gradient-rose', icon: 'alert-triangle', content: <HAProxyCrashSimulation /> },

        const App = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            const [direction, setDirection] = useState(0);

            const nextSlide = useCallback(() => { if (currentSlide < slides.length - 1) { setDirection(1); setCurrentSlide(prev => prev + 1); } }, [currentSlide]);
            const prevSlide = useCallback(() => { if (currentSlide > 0) { setDirection(-1); setCurrentSlide(prev => prev - 1); } }, [currentSlide]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
                    if (e.key === 'ArrowLeft') prevSlide();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [nextSlide, prevSlide]);

            const slide = slides[currentSlide];

            return (
                <div className={`h-screen w-screen overflow-hidden relative transition-colors duration-1000 ${slide.gradient}`}>
                    <div className="absolute inset-0 opacity-20 pointer-events-none">
                        <div className="absolute top-[-15%] left-[-15%] w-[55%] h-[55%] bg-blue-500 rounded-full blur-[160px]"></div>

                                </div>
                                <div>
                                    <h1 className="text-3xl font-black tracking-tighter uppercase leading-none">{slide.title}</h1>

                                </div>
                            </div>
                            <div className="flex gap-2.5">
                                {slides.map((_, i) => (
                                    <div key={i} onClick={() => { setDirection(i > currentSlide ? 1 : -1); setCurrentSlide(i); }} className={`h-1.5 rounded-full transition-all duration-500 cursor-pointer ${i === currentSlide ? 'w-12 bg-white' : 'w-2 bg-white/10 hover:bg-white/30'}`} />
                                ))}
                            </div>
                        </header>

                        <main className="flex-1 relative overflow-hidden flex flex-col pt-4">
                            <AnimatePresence mode="wait" custom={direction}>
                                <motion.div key={currentSlide} custom={direction} initial={{ opacity: 0, x: direction * 100, scale: 0.98, filter: 'blur(15px)' }} animate={{ opacity: 1, x: 0, scale: 1, filter: 'blur(0px)' }} exit={{ opacity: 0, x: direction * -100, scale: 1.02, filter: 'blur(15px)' }} transition={{ duration: 0.6, ease: [0.16, 1, 0.3, 1] }} className="w-full h-full flex flex-col">
                                    <div className="mb-10 max-w-5xl">
                                        <motion.p initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.25 }} className="text-xl text-white/80 leading-relaxed font-light tracking-tight italic border-l-2 border-white/10 pl-8">"{slide.description}"</motion.p>
                                    </div>
                                    <motion.div initial={{ opacity: 0, y: 40 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.4 }} className="flex-1 slide-content-container">
                                        {slide.content}
                                    </motion.div>
                                </motion.div>
                            </AnimatePresence>
                        </main>

                        <footer className="mt-8 flex justify-between items-center border-t border-white/5 pt-10">

                                <button onClick={nextSlide} disabled={currentSlide === slides.length - 1} className={`p-6 rounded-full glass transition-all border-white/10 ${currentSlide === slides.length - 1 ? 'opacity-10' : 'hover:bg-white/10 hover:scale-110 active:scale-95 shadow-[0_10px_40px_rgba(0,0,0,0.3)]'}`}><Icon name="chevron-right" size={28}/></button>
                            </div>
                        </footer>
                    </div>
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-xs font-black font-mono text-white/10 tracking-[0.3em]">{String(currentSlide + 1).padStart(2, '0')} / {String(slides.length).padStart(2, '0')}</div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
