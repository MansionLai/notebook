    <script type="text/babel">

        const MotionLib = window.Motion || window.FramerMotion;

        // --- Icons Wrapper ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                const timer = setInterval(() => {
                    if (window.lucide && window.lucide.createIcons && iconRef.current) {

                            attrs: { class: className, 'stroke-width': 2, 'width': size, 'height': size },
                            nameAttr: 'data-lucide'

                        clearInterval(timer);

                return () => clearInterval(timer);

            return (
                <div className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}>
                    <i ref={iconRef} data-lucide={name} style={{ width: size, height: size }}></i>

        // --- Slide Content Definitions ---
        const slides = [
            // Topic: Intro to Rook (0 - 3)
            { id: '1-hero', title: 'Rook-Ceph Deep Dive', subtitle: 'Storage Orchestration for Kubernetes', description: '讓 Kubernetes 自行管理儲存基礎設施的終極解決方案。', gradient: 'gradient-blue', icon: 'database', content: (
                <div className="flex flex-col items-center justify-center text-center space-y-12 py-10">

                    <div className="grid grid-cols-2 gap-8 w-full max-w-3xl">
                        <div className="p-8 glass rounded-[40px] text-left border-l-4 border-l-cyan-400 shadow-2xl">
                            <h4 className="font-black text-xl mb-2 text-cyan-300 uppercase tracking-tighter">Cloud-Native Storage</h4>
                            <p className="text-xs text-white/50 leading-relaxed font-light">將 Ceph 從獨立的硬體叢集，完美轉型為 Kubernetes 原生運行的 Pod 服務。</p>
                        </div>
                        <div className="p-8 glass rounded-[40px] text-left border-l-4 border-l-blue-500 shadow-2xl">
                            <h4 className="font-black text-xl mb-2 text-blue-400 uppercase tracking-tighter">Automated Operations</h4>
                            <p className="text-xs text-white/50 leading-relaxed font-light">透過 Rook Operator 模式，將「人類儲存管理員」的智慧寫入軟體中自動執行。</p>
                        </div>
                    </div>
                </div>
            )},
            { id: '2-what-is-rook', title: 'What is Rook?', subtitle: 'The Storage Operator', description: 'Rook 不是儲存系統，它是「儲存系統的管理員」。', gradient: 'gradient-slate', icon: 'cpu', content: (
                <div className="flex flex-col md:flex-row gap-10 py-6 items-center">

                        </p>
                    </div>
                    <div className="flex-1 p-8 glass rounded-[40px] border-cyan-500/20 relative overflow-hidden shadow-2xl text-center">

                        <h6 className="font-black text-lg text-cyan-400 mb-2 uppercase tracking-widest">Robot Storage Admin</h6>
                        <p className="text-xs text-white/50 leading-relaxed font-light">Rook Operator 在背景 24/7 監控你的儲存叢集，當有節點故障時自動觸發修復，完全無需人工介入。</p>
                    </div>
                </div>
            )},
            { id: '3-why-rook', title: 'Why Rook + Ceph?', subtitle: 'The Perfect Match', description: '為何不把 Ceph 架設在外部？為何要放在 K8s 裡面？', gradient: 'gradient-cyan', icon: 'check-circle', content: (

                    <div className="p-8 glass rounded-3xl flex flex-col justify-between border-white/5 hover:border-cyan-500/50 transition-colors">
                        <h6 className="text-cyan-300 font-bold mb-3 uppercase tracking-tighter">Unified Control Plane</h6>
                        <p className="text-xs text-white/60 font-light leading-relaxed">不再需要兩套管理工具。儲存與運算都用 <code className="text-cyan-200">kubectl</code> 統一管理，大幅降低維運複雜度與學習曲線。</p>

                    <div className="p-8 glass rounded-3xl flex flex-col justify-between border-white/5 hover:border-cyan-500/50 transition-colors">

                        <p className="text-xs text-white/60 font-light leading-relaxed">運算節點 (Worker) 也是儲存節點 (OSD)。K8s 的 Pod 可以直接存取本地硬碟，實現超融合架構 (HCI)，最大化硬體價值。</p>
                        <Icon name="layers" size={32} className="text-white/10 mt-6 self-end"/>

                    <div className="p-8 glass rounded-3xl flex flex-col justify-between border-white/5 hover:border-cyan-500/50 transition-colors">

                        <p className="text-xs text-white/60 font-light leading-relaxed">結合 CSI，當開發者要求 PVC (PersistentVolumeClaim) 時，Rook-Ceph 會在毫秒級動態切分 Volume，完全自動化。</p>

                    </div>
                </div>

            // Topic: Architecture (4 - 9)
            { id: '4-arch-overview', title: 'Rook Architecture', subtitle: 'How it works together', description: 'Rook 與 Ceph 在 Kubernetes 中的層級關係。', gradient: 'gradient-blue', icon: 'git-merge', content: (

                            <div className="flex-1"><h6 className="font-bold">Kubernetes API & CRDs</h6><p className="text-[10px] text-white/50">人類或 CI/CD 與儲存溝通的介面 (YAML)。</p></div>

                            <div className="flex-1"><h6 className="font-bold">Rook Operator</h6><p className="text-[10px] text-white/50">控制迴圈 (Control Loop)。將使用者的期望狀態 (CRD) 轉換為實際的 Ceph 動作。</p></div>
                        </div>
                        <div className="p-6 bg-purple-500/10 border border-purple-500/30 rounded-2xl flex items-center gap-6">
                            <div className="w-24 text-center font-black text-purple-400">Layer 3</div>
                            <div className="flex-1"><h6 className="font-bold">Ceph Daemons (MON, MGR, OSD)</h6><p className="text-[10px] text-white/50">實際執行儲存寫入的進程，現在都被打包成 Kubernetes Pods 運行。</p></div>

                            <div className="flex-1"><h6 className="font-bold">Raw Block Devices</h6><p className="text-[10px] text-white/50">實體機上的裸磁碟 (如 /dev/sdb, NVMe)，被 OSD 直接掛載使用。</p></div>
                        </div>
                    </div>
                </div>
            )},

                    <div className="space-y-6">

                            <p className="text-xs text-white/70 leading-relaxed font-light">
                                Operator 向 K8s API 註冊 Watcher，持續監聽 Ceph 相關的 CRD 變化。<br/>
                                當你建立一個 <code className="text-cyan-300">CephCluster</code>，它會立刻解析，並啟動對應的 DaemonSet/Deployment。
                            </p>
                        </div>
                        <div className="p-6 glass rounded-3xl border-l-4 border-cyan-500 bg-cyan-500/5 shadow-xl">
                            <h6 className="font-bold text-sm text-cyan-400 mb-2 uppercase">2. Health Management</h6>
                            <p className="text-xs text-white/70 leading-relaxed font-light">
                                如果某個 Worker Node 掛了，對應的 OSD Pod 也會死掉。<br/>
                                Operator 會偵測到狀態改變，並在硬體恢復時自動拉起新的 OSD，或是執行 Ceph 的資料重平衡。
                            </p>

                    <div className="flex flex-col items-center justify-center p-12 glass rounded-[50px] border border-white/5 shadow-inner relative overflow-hidden">
                        <Icon name="refresh-cw" size={80} className="text-cyan-400 mb-6 animate-spin-slow" />
                        <h5 className="text-xl font-black mb-2 uppercase tracking-widest text-center">Continuous<br/>Reconciliation</h5>
                        <p className="text-[10px] text-white/40 text-center">Desired State == Actual State</p>
                    </div>
                </div>

                        <p className="text-xs text-white/70 leading-relaxed font-light mb-6">
                            Rook 會在每一個 K8s 節點上部署一個 <code className="text-cyan-300 font-bold">rook-discover</code> 的 Pod。它會掃描該節點上的所有區塊裝置 (Block Devices)，並將結果寫入 ConfigMap 中。
                        </p>
                        <div className="p-4 bg-black/40 rounded-xl border border-white/5">
                            <span className="text-[10px] text-cyan-400 font-bold block mb-1">What it looks for:</span>
                            <ul className="list-disc pl-4 text-[10px] text-white/60 space-y-1">
                                <li>空的磁碟 (未格式化, 未分區)</li>
                                <li>沒有檔案系統 (No filesystem)</li>
                                <li>不是 K8s 根目錄所使用的磁碟</li>
                            </ul>
                        </div>
                    </div>
                </div>
            )},
            { id: '7-osd-provisioning', title: 'OSD Provisioning', subtitle: 'Turning Disks into Storage', description: '發現硬碟後，Rook 如何將它們轉化為 Ceph OSD？', gradient: 'gradient-slate', icon: 'hard-drive', content: (
                <div className="flex flex-col items-center py-6">
                    <div className="w-full max-w-4xl space-y-4">
                        <div className="p-6 bg-white/5 border border-white/10 rounded-2xl flex items-center gap-6">
                            <div className="w-16 h-16 bg-blue-500/20 rounded-full flex items-center justify-center text-blue-400 font-black">1</div>
                            <div className="flex-1"><h6 className="font-bold text-blue-300">Preparation Job</h6><p className="text-[11px] text-white/50 leading-relaxed font-light">Operator 發起一個一次性 Job (<code className="text-white">rook-ceph-osd-prepare</code>)，在目標節點上執行。它會利用 LVM 初始化硬碟，創建 OSD 所需的 metadata。</p></div>
                        </div>
                        <Icon name="arrow-down" size={24} className="text-white/20 mx-auto" />
                        <div className="p-6 bg-white/5 border border-white/10 rounded-2xl flex items-center gap-6">

                            <div className="flex-1"><h6 className="font-bold text-cyan-300">OSD Deployment</h6><p className="text-[11px] text-white/50 leading-relaxed font-light">一旦硬碟初始化完成，Operator 會動態建立一個對應的 Deployment (<code className="text-white">rook-ceph-osd-0</code>)。</p></div>
                        </div>
                        <Icon name="arrow-down" size={24} className="text-white/20 mx-auto" />
                        <div className="p-6 bg-white/5 border border-white/10 rounded-2xl flex items-center gap-6">
                            <div className="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center text-emerald-400 font-black">3</div>
                            <div className="flex-1"><h6 className="font-bold text-emerald-300">Bluestore Engine</h6><p className="text-[11px] text-white/50 leading-relaxed font-light">OSD Pod 啟動，接管裸硬碟。現在資料會透過 Ceph 的 Bluestore 引擎直接寫入硬碟，繞過作業系統的檔案系統，達到極致效能。</p></div>
                        </div>

            { id: '8-mon-quorum', title: 'MON Quorum', subtitle: 'The Source of Truth', description: 'Ceph 依賴 MON (Monitor) 來維護叢集地圖 (Cluster Map)。Rook 如何管理它們？', gradient: 'gradient-purple', icon: 'share-2', content: (

                            <h6 className="font-bold text-sm text-purple-400 mb-2 uppercase">Quorum (多數決)</h6>
                            <p className="text-xs text-white/70 leading-relaxed font-light">
                                Ceph MON 使用 Paxos 演算法。必須有「多數」的 MON 存活，叢集才能讀寫。<br/>

                                Rook Operator 會自動將 3 個 MON Pod 分散部署到<strong>不同的實體 Node 上</strong> (Anti-Affinity)。<br/>
                                若某個 MON 掛了，Operator 會自動清理其狀態，並在健康的節點上拉起一個新的 MON 來恢復 Quorum。

                </div>

{`apiVersion: ceph.rook.io/v1

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-start py-4">
                    <div className="code-block w-full text-[10px]">
{`# 1. 部署 Toolbox Pod
kubectl apply -f toolbox.yaml

# 2. 進入 Toolbox 終端機
kubectl -n rook-ceph exec -it deploy/rook-ceph-tools -- bash

# 3. 執行原生 Ceph 指令
ceph status
ceph osd tree
rados df`}
                    </div>
                    <div className="space-y-4">
                        <div className="p-6 glass rounded-[30px] border-emerald-500/20 shadow-xl bg-emerald-500/5">
                            <h6 className="font-bold text-emerald-400 mb-2">ceph status (ceph -s)</h6>
                            <p className="text-xs text-white/60 font-light leading-relaxed">這是排查的第一步。它會告訴你叢集健康度 (HEALTH_OK / HEALTH_WARN / HEALTH_ERR)，MON 是否達到 Quorum，以及 OSD 的存活數量。</p>
                        </div>
                    </div>
                </div>
            )},
            { id: '28-operator-logs', title: 'Checking Operator Logs', subtitle: 'Why did the automated task fail?', description: '當 OSD 沒有如預期被創建時，第一時間該找誰？找 Operator。', gradient: 'gradient-slate', icon: 'file-text', content: (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-start py-4">
                    <div className="space-y-6">
                        <div className="p-6 glass rounded-[30px] border-blue-500/20 shadow-xl bg-blue-500/5">
                            <h6 className="font-bold text-blue-400 mb-2">The Brain's Diary</h6>
                            <p className="text-xs text-white/60 font-light leading-relaxed">Operator 記錄了它解析 CRD 與調用 Ceph 指令的所有過程。如果硬碟沒被格式化，通常能在這裡看到 LVM 或儲存路徑報錯。</p>
                        </div>
                    </div>
                    <div className="code-block w-full text-[9px]">
{`# 查看 Operator 日誌
kubectl -n rook-ceph logs deploy/rook-ceph-operator -f

# 常見錯誤範例：
# "failed to provision OSD: device /dev/sdb has a filesystem"
# (硬碟不乾淨，Rook 拒絕使用以防覆蓋使用者資料)`}
                    </div>
                </div>
            )},
            { id: '29-wipe-disks', title: 'Cleaning Disks', subtitle: 'The Reset Button', description: 'Rook 對於硬碟的潔癖：只使用徹底乾淨的裸碟。', gradient: 'gradient-rose', icon: 'trash-2', content: (
                <div className="flex flex-col md:flex-row gap-8 py-6 items-center">
                    <div className="flex-1 space-y-6">
                        <div className="p-6 glass rounded-3xl border-l-4 border-rose-500 bg-rose-500/5">
                            <h5 className="font-bold text-rose-400 mb-2">Wiping a Disk</h5>
                            <p className="text-xs text-white/60 font-light leading-relaxed">
                                如果你曾經在硬碟上安裝過其他檔案系統，或者重裝了 Kubernetes，Rook 會拒絕納管這顆硬碟。<br/><br/>
                                你必須登入該實體 Node，使用 <code className="text-rose-300">dd</code> 或 <code className="text-rose-300">sgdisk</code> 徹底清除分區表與 metadata。
                            </p>
                        </div>
                    </div>
                    <div className="flex-1 code-block text-[9px]">
{`# SSH 登入目標 Node
ssh root@worker-node-1

# 警告：這會刪除硬碟上所有資料
sgdisk --zap-all /dev/sdb
dd if=/dev/zero of=/dev/sdb bs=1M count=100 oflag=direct,dsync

# 清除殘留的 LVM metadata
wipefs -a /dev/sdb`}
                    </div>
                </div>
            )},
            { id: '30-final', title: 'The End', subtitle: 'Thank You for Your Time', description: 'Prepared by Gemini CLI Agent for MansionLai.', gradient: 'gradient-slate', icon: 'heart', content: (
                <div className="flex flex-col items-center justify-center h-full text-center py-20 relative">
                    <motion.div animate={{ y: [0, -10, 0] }} transition={{ repeat: Infinity, duration: 4, ease: "easeInOut" }}>
                        <Icon name="database" size={100} className="text-cyan-500 mb-10 drop-shadow-[0_0_30px_rgba(34,211,238,0.6)]"/>
                    </motion.div>
                    <h5 className="text-7xl font-black uppercase tracking-tighter mb-6 relative">
                        Rook Solid.
                        <div className="absolute -bottom-2 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-500 to-transparent opacity-50"></div>
                    </h5>
                    <p className="text-white/20 text-sm font-mono uppercase tracking-[0.6em] mt-6">Rook-Ceph Lab • 2026</p>
                </div>
            )}
        ];

        const topics = [
            { name: 'Intro', slideIndex: 0 },
            { name: 'Architecture', slideIndex: 4 },
            { name: 'CRDs', slideIndex: 9 },
            { name: 'CSI Integration', slideIndex: 15 },
            { name: 'Operations', slideIndex: 20 },
            { name: 'Troubleshooting', slideIndex: 25 }
        ];

        // --- App Component ---
        const App = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            const [direction, setDirection] = useState(0);

            const jumpTo = useCallback((index) => {
                if (index !== currentSlide) {
                    setDirection(index > currentSlide ? 1 : -1);
                    setCurrentSlide(index);
                }
            }, [currentSlide]);

            const nextSlide = useCallback(() => { if (currentSlide < slides.length - 1) { jumpTo(currentSlide + 1); } }, [currentSlide, jumpTo]);
            const prevSlide = useCallback(() => { if (currentSlide > 0) { jumpTo(currentSlide - 1); } }, [currentSlide, jumpTo]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
                    if (e.key === 'ArrowLeft') prevSlide();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [nextSlide, prevSlide]);

            const slide = slides[currentSlide];

            return (
                <div className={`h-screen w-screen overflow-hidden relative transition-colors duration-1000 ${slide.gradient}`}>
                    <div className="absolute top-0 left-0 h-1 bg-white/10 w-full z-50">
                        <motion.div className="h-full bg-cyan-400" initial={{ width: 0 }} animate={{ width: `${((currentSlide + 1) / slides.length) * 100}%` }} transition={{ duration: 0.3 }} />
                    </div>

                    <div className="absolute inset-0 opacity-10 pointer-events-none">
                        <div className="absolute top-[-15%] left-[-15%] w-[55%] h-[55%] bg-cyan-500 rounded-full blur-[160px]"></div>
                        <div className="absolute bottom-[-15%] right-[-15%] w-[55%] h-[55%] bg-blue-500 rounded-full blur-[160px]"></div>
                    </div>

                    <div className="relative z-10 h-full flex flex-col p-10 max-w-7xl mx-auto">
                        <header className="flex justify-between items-center mb-6">
                            <div className="flex items-center gap-6">
                                <div className="p-3.5 glass rounded-2xl flex items-center justify-center shadow-2xl border-white/15">
                                    <Icon name={slide.icon} className="text-white" size={30} />
                                </div>
                                <div>
                                    <h1 className="text-3xl font-black tracking-tighter uppercase leading-none">{slide.title}</h1>
                                    <p className="text-[10px] text-white/40 font-mono mt-2 uppercase tracking-[0.2em] leading-none">{slide.subtitle}</p>
                                </div>
                            </div>
                            
                            {/* Topic Navigation Buttons */}
                            <div className="flex gap-2">
                                {topics.map((topic, i) => {
                                    const nextTopicIndex = topics[i + 1] ? topics[i + 1].slideIndex : slides.length;
                                    const isActive = currentSlide >= topic.slideIndex && currentSlide < nextTopicIndex;
                                    return (
                                        <button 
                                            key={topic.name}
                                            onClick={() => jumpTo(topic.slideIndex)}
                                            className={`px-4 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest transition-all duration-300 ${
                                                isActive 
                                                ? 'bg-cyan-500 text-black shadow-[0_0_15px_rgba(34,211,238,0.5)]' 
                                                : 'bg-white/5 text-white/40 hover:bg-white/15 hover:text-white'
                                            }`}
                                        >
                                            {topic.name}
                                        </button>
                                    );
                                })}
                            </div>
                        </header>

                        <main className="flex-1 relative overflow-hidden flex flex-col pt-4">
                            <AnimatePresence mode="wait" custom={direction}>
                                <motion.div key={currentSlide} custom={direction} initial={{ opacity: 0, x: direction * 100, scale: 0.98, filter: 'blur(15px)' }} animate={{ opacity: 1, x: 0, scale: 1, filter: 'blur(0px)' }} exit={{ opacity: 0, x: direction * -100, scale: 1.02, filter: 'blur(15px)' }} transition={{ duration: 0.5, ease: [0.16, 1, 0.3, 1] }} className="w-full h-full flex flex-col">
                                    <div className="mb-8 max-w-5xl">
                                        <motion.p initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.2 }} className="text-lg text-white/80 leading-relaxed font-light tracking-tight italic border-l-2 border-cyan-500/30 pl-6">"{slide.description}"</motion.p>
                                    </div>
                                    <motion.div initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.35 }} className="flex-1 slide-content-container">
                                        {slide.content}
                                    </motion.div>
                                </motion.div>
                            </AnimatePresence>
                        </main>

                        <footer className="mt-6 flex justify-between items-center border-t border-white/5 pt-6">
                            <div className="text-[10px] font-black font-mono text-white/20 uppercase tracking-[0.4em]">Rook-Ceph Deep Dive • 2026</div>
                            <div className="flex gap-6">
                                <button onClick={prevSlide} disabled={currentSlide === 0} className={`p-5 rounded-full glass transition-all border-white/10 ${currentSlide === 0 ? 'opacity-10' : 'hover:bg-white/10 hover:scale-110 active:scale-95 shadow-xl'}`}><Icon name="chevron-left" size={24}/></button>
                                <button onClick={nextSlide} disabled={currentSlide === slides.length - 1} className={`p-5 rounded-full glass transition-all border-white/10 ${currentSlide === slides.length - 1 ? 'opacity-10' : 'hover:bg-white/10 hover:scale-110 active:scale-95 shadow-xl'}`}><Icon name="chevron-right" size={24}/></button>
                            </div>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
