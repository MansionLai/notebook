        const App = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            const [direction, setDirection] = useState(0);

            const nextSlide = useCallback(() => {
                if (currentSlide < slides.length - 1) {
                    setDirection(1);
                    setCurrentSlide(prev => prev + 1);
                }
            }, [currentSlide]);

            const prevSlide = useCallback(() => {
                if (currentSlide > 0) {
                    setDirection(-1);
                    setCurrentSlide(prev => prev - 1);
                }
            }, [currentSlide]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
                    if (e.key === 'ArrowLeft') prevSlide();
                    if (e.key === 'Home') setCurrentSlide(0);
                    if (e.key === 'End') setCurrentSlide(slides.length - 1);
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [nextSlide, prevSlide]);

            const slide = slides[currentSlide];

            return (
                <div className={`h-screen w-screen overflow-hidden relative transition-colors duration-1000 ${slide.gradient}`}>
                    <div className="absolute top-0 left-0 h-1 bg-white/10 w-full z-50">
                        <motion.div 
                            className="h-full bg-blue-400"
                            initial={{ width: 0 }}
                            animate={{ width: `${((currentSlide + 1) / slides.length) * 100}%` }}
                            transition={{ duration: 0.3 }}
                        />
                    </div>

                    <div className="relative z-10 h-full flex flex-col p-12 max-w-7xl mx-auto">
                        <header className="flex justify-between items-start mb-12">
                            <div className="flex items-center gap-4">
                                <div className="p-3 glass rounded-2xl">
                                    <Icon name={slide.icon} className="text-white" size={24} />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black tracking-tighter uppercase">{slide.title}</h1>
                                    <p className="text-xs text-white/50 font-mono">{slide.subtitle}</p>
                                </div>
                            </div>
                            <div className="text-[10px] font-mono text-white/20 text-right">
                                ROOK-CEPH DEEP DIVE<br/>
                                SLIDE {String(currentSlide + 1).padStart(2, '0')}
                            </div>
                        </header>

                        <main className="flex-1 relative flex flex-col justify-center">
                            <AnimatePresence mode="wait" custom={direction}>
                                <motion.div
                                    key={currentSlide}
                                    custom={direction}
                                    initial={{ opacity: 0, x: direction * 50, scale: 0.98 }}
                                    animate={{ opacity: 1, x: 0, scale: 1 }}
                                    exit={{ opacity: 0, x: direction * -50, scale: 1.02 }}
                                    transition={{ duration: 0.4, ease: [0.16, 1, 0.3, 1] }}
                                    className="w-full"
                                >
                                    <div className="mb-10 max-w-3xl">
                                        <motion.p 
                                            initial={{ opacity: 0, y: 10 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            transition={{ delay: 0.2 }}
                                            className="text-lg text-white/80 leading-relaxed font-light"
                                        >
                                            {slide.description}
                                        </motion.p>
                                    </div>
                                    <motion.div 
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: 0.3 }}
                                        className="min-h-[300px]"
                                    >
                                        {slide.content}
                                    </motion.div>
                                </motion.div>
                            </AnimatePresence>
                        </main>

                        <footer className="mt-12 flex justify-between items-center border-t border-white/10 pt-8">
                            <div className="flex items-center gap-6">
                                <div className="text-[10px] font-mono text-white/20 uppercase tracking-[0.2em]">
                                    3-Node KubeVirt Lab • Phase 3

                                <div className="h-4 w-px bg-white/10"></div>
                                <div className="flex gap-1">
                                    {slides.map((_, i) => (

                                            key={i} 
                                            onClick={() => setCurrentSlide(i)}
                                            className={`h-1.5 rounded-full transition-all duration-300 ${i === currentSlide ? 'w-4 bg-blue-400' : 'w-1.5 bg-white/10 hover:bg-white/30'}`}
                                        />
                                    ))}
                                </div>
                            </div>
                            <div className="flex gap-4">
                                <button 
                                    onClick={prevSlide}
                                    disabled={currentSlide === 0}
                                    className={`p-4 rounded-full glass transition-all ${currentSlide === 0 ? 'opacity-10 cursor-not-allowed' : 'hover:bg-white/10 active:scale-90'}`}
                                >
                                    <Icon name="chevron-left" />
                                </button>
                                <button 
                                    onClick={nextSlide}
                                    disabled={currentSlide === slides.length - 1}
                                    className={`p-4 rounded-full glass transition-all ${currentSlide === slides.length - 1 ? 'opacity-10 cursor-not-allowed' : 'hover:bg-white/10 active:scale-90'}`}
                                >
                                    <Icon name="chevron-right" />
                                </button>
                            </div>
                        </footer>
                    </div>

                    </div>
                </div>
            );
        };
